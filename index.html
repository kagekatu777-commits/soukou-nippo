HTML
<!DOCTYPE html>
<html lang="ja">
<head>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#555555">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>走行日報</title>

<style>
*{box-sizing:border-box}
body{font-family:sans-serif;background:#f5f5f5;margin:0;padding:15px}
.card{background:white;border-radius:12px;padding:15px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
h1{text-align:center;color:#1565c0;margin-bottom:10px}
.header-info{background:#e3f2fd;border-radius:10px;padding:12px;margin-bottom:15px;font-size:17px;line-height:1.7}
.header-company{font-size:20px;font-weight:bold}
.header-row{font-weight:bold}
.settings-button{width:100%;margin-top:10px;padding:10px;font-size:16px;background:#757575;color:white;border:none;border-radius:8px}
.settings{display:none;background:#f5f5f5;border-radius:10px;padding:12px;margin-bottom:15px}
.settings h2{margin-top:0;color:#1565c0}
label{display:block;margin-top:15px;font-weight:bold;font-size:18px}
input{width:100%;padding:12px;font-size:20px;border-radius:8px;border:1px solid #ccc}
button{width:100%;margin-top:20px;padding:15px;font-size:22px;background:#1565c0;color:white;border:none;border-radius:10px}
.settings-save{background:#2e7d32}
.distance{background:#eeeeee}
.auto-info{font-size:14px;color:#555;margin-top:5px}
.edit-mode{background:#fff3cd;border:2px solid #ff9800;border-radius:10px;padding:10px;margin-top:15px;color:#795548;font-weight:bold;text-align:center}
.cancel-button{background:#757575}
.monthly-print{margin-top:25px;padding:15px;background:#e3f2fd;border-radius:10px}
.monthly-print h2{margin-top:0;color:#1565c0}
.monthly-list{margin-top:25px;display:none}
.monthly-list h2{color:#1565c0}
.monthly-summary{background:#eeeeee;padding:12px;border-radius:8px;font-size:18px;font-weight:bold;margin-bottom:10px;line-height:1.8}
.saved-reports{margin-top:30px}
.saved-reports h2{color:#1565c0;margin-bottom:12px}
.saved-month{margin-top:12px;border-radius:10px;overflow:hidden;border:1px solid #ccc;background:#fafafa}
.saved-month-header{width:100%;margin:0;padding:14px;font-size:19px;font-weight:bold;background:#e3f2fd;color:#1565c0;border:none;border-radius:0;text-align:left;cursor:pointer}
.saved-month-header:active{background:#bbdefb}
.saved-month-content{display:none;padding:8px;background:white}
.saved-month-content.open{display:block}
.saved-month-count{font-size:15px;font-weight:normal;color:#555;margin-left:5px}
.saved-report-card{background:#fff;border:1px solid #ddd;border-radius:9px;padding:10px;margin-top:8px;font-size:16px;line-height:1.7}
.saved-report-date{font-size:17px;font-weight:bold;color:#1565c0;margin-bottom:4px}
.saved-report-distance{font-size:18px;font-weight:bold}
.saved-report-actions{display:flex;gap:8px;margin-top:8px}
.saved-report-actions button{margin:0;flex:1;padding:9px 5px;font-size:15px;border-radius:7px}
.saved-edit-button{background:#2e7d32}
.saved-delete-button{background:#d32f2f}
.no-saved-reports{background:#eeeeee;border-radius:8px;padding:15px;text-align:center;color:#666}
.oil-toggle-button{margin-top:25px;background:#ef6c00}
.oil-management{display:none;margin-top:15px;padding:15px;background:#fff8e1;border-radius:10px;border:2px solid #ffb300}
.oil-management h2{margin-top:0;color:#e65100}
.oil-current{background:white;border-radius:8px;padding:12px;margin-top:10px;font-size:18px;line-height:1.8}
.oil-next{font-size:22px;font-weight:bold;color:#e65100}
.oil-warning{background:#ffebee;border:2px solid #e53935;color:#c62828;padding:12px;border-radius:8px;margin-top:10px;font-size:18px;font-weight:bold;display:none}
.oil-ok{background:#e8f5e9;border:2px solid #43a047;color:#2e7d32;padding:12px;border-radius:8px;margin-top:10px;font-size:16px;font-weight:bold;display:none}
.oil-save{background:#ef6c00}
.oil-delete{background:#d32f2f;color:white;border:none;border-radius:6px;padding:7px 10px;margin:0;width:auto;font-size:13px}
.fuel-toggle-button{margin-top:25px;background:#1976d2}
.fuel-management{display:none;margin-top:15px;padding:15px;background:#e3f2fd;border-radius:10px;border:2px solid #1976d2}
.fuel-management h2{margin-top:0;color:#1565c0}
.fuel-save{background:#1976d2}
.fuel-delete{background:#d32f2f;color:white;border:none;border-radius:6px;padding:7px 10px;margin:0;width:auto;font-size:13px}
.fuel-history-item{background:white;border:1px solid #ddd;border-radius:8px;padding:10px;margin-top:8px;font-size:16px;line-height:1.7}
.fuel-economy{font-size:20px;font-weight:bold;color:#1565c0}
.fuel-mark{font-weight:bold;color:#1565c0}
.oil-mark{font-weight:bold;color:#e65100}
table{width:100%;margin-top:20px;border-collapse:collapse}
th,td{border:1px solid #ccc;padding:8px;text-align:center}
th{background:#1565c0;color:white}
.edit-button{background:#2e7d32;color:white;border:none;border-radius:6px;padding:8px 10px;margin:0 0 5px 0;width:auto;font-size:14px}
.delete-button{background:#d32f2f;color:white;border:none;border-radius:6px;padding:8px 10px;margin:0;width:auto;font-size:14px}
.action-cell{white-space:nowrap}
@media(max-width:600px){
table{font-size:12px}
th,td{padding:5px}
}
</style>
</head>

<body>
<div class="card">
<h1>🚚走行日報</h1>

<div class="header-info">
<div class="header-company" id="headerCompany">会社名未設定</div>
<div class="header-row">車番：<span id="headerCar">未設定</span></div>
<div class="header-row">運転者：<span id="headerDriver">未設定</span></div>
</div>

<button class="settings-button" onclick="toggleSettings()">⚙ 基本情報を変更</button>

<div class="settings" id="settings">
<h2>基本情報設定</h2>
<label>会社名</label>
<input type="text" id="settingCompany" placeholder="会社名を入力">
<label>車番</label>
<input type="text" id="settingCar" placeholder="車番を入力">
<label>運転者名</label>
<input type="text" id="settingDriver" placeholder="運転者名を入力">
<button class="settings-save" onclick="saveSettings()">基本情報を保存</button>
</div>

<div id="editMode" class="edit-mode" style="display:none;">✏️ 日報を編集中です</div>

<label>日付</label>
<input type="date" id="date">

<label>出発時走行距離</label>
<input type="number" id="start" placeholder="前回の帰社時走行距離から自動入力">
<div class="auto-info">※休みの日があっても、直近の日報の帰社時走行距離から自動入力されます</div>

<label>帰社時走行距離</label>
<input type="number" id="returnMileage" placeholder="帰社時の走行距離を入力">

<label>控除走行距離</label>
<input type="text" id="distance" class="distance" readonly placeholder="自動計算">

<label>運行内容</label>
<input type="text" id="work" placeholder="運行内容を入力">

<label>備考</label>
<input type="text" id="memo" placeholder="備考を入力">

<button id="saveButton" onclick="save()">日報を保存</button>
<button id="cancelEditButton" class="cancel-button" onclick="cancelEdit()" style="display:none;">編集をキャンセル</button>

<button id="fuelToggleButton" class="fuel-toggle-button" onclick="toggleFuelManagement()">⛽ 給油管理を見る</button>

<div class="fuel-management" id="fuelManagement">
<h2>⛽ 給油管理</h2>
<div class="auto-info">※給油したときに、スタンドで走行距離と給油量を入力してください</div>
<label>給油時走行距離</label>
<input type="number" id="fuelMileage" placeholder="例：125320">
<label>給油量（L）</label>
<input type="number" id="fuelLiters" step="0.1" placeholder="例：38.5">
<button class="fuel-save" onclick="saveFuel()">⛽ 給油を記録</button>
<div id="fuelHistory" style="margin-top:15px;"></div>
</div>

<button id="oilToggleButton" class="oil-toggle-button" onclick="toggleOilManagement()">🛢️ オイル交換管理を見る</button>

<div class="oil-management" id="oilManagement">
<h2>🛢️ オイル交換管理</h2>
<div class="oil-current">
現在の走行距離：<strong id="oilCurrentMileage">---</strong> km
<br>次回オイル交換：
<span class="oil-next" id="oilNextMileage">未登録</span>
</div>
<div class="oil-warning" id="oilWarning"></div>
<div class="oil-ok" id="oilOk"></div>
<label>オイル交換時の走行距離</label>
<input type="number" id="oilChangeMileage" placeholder="例：124761">
<div class="auto-info">※次回交換距離は「交換時の走行距離＋4,000km」です</div>
<button class="oil-save" onclick="saveOilChange()">🛢️ オイル交換を記録</button>
<div id="oilHistory" style="margin-top:15px;"></div>
</div>

<div class="monthly-print">
<h2>📄 月間A4 PDF</h2>
<label>印刷する月</label>
<input type="month" id="printMonth">
<button onclick="openMonthlyPrint()">🖨️ A4 PDFプレビュー</button>
</div>

<button id="monthlyListButton" onclick="toggleMonthlyList()">📅 月間日報一覧を見る</button>

<div class="monthly-list" id="monthlyList">
<h2>📅 月間日報一覧</h2>
<div class="monthly-summary" id="monthlySummary"></div>
<table>
<thead>
<tr>
<th>日付</th><th>運転者</th><th>車番</th><th>出発</th><th>帰社</th><th>距離</th><th>運行内容</th><th>給油</th><th>オイル交換</th>
</tr>
</thead>
<tbody id="monthlyListBody"></tbody>
</table>
</div>

<div class="saved-reports">
<h2>📋 保存済み日報</h2>
<div id="list"></div>
</div>
</div>

<script>
let editingIndex=-1;

function getToday(){
let today=new Date();
return today.getFullYear()+"-"+String(today.getMonth()+1).padStart(2,"0")+"-"+String(today.getDate()).padStart(2,"0");
}

function getDayOfWeek(dateString){
if(!dateString)return "";
let d=new Date(dateString+"T00:00:00");
return ["日","月","火","水","木","金","土"][d.getDay()];
}

function formatDateWithDay(dateString){
if(!dateString)return "";
let parts=dateString.split("-");
if(parts.length!==3)return dateString;
return parts[0]+"/"+parts[1]+"/"+parts[2]+"（"+getDayOfWeek(dateString)+"）";
}

function loadPreviousMileage(){
if(editingIndex!==-1)return;
let dateValue=document.getElementById("date").value;
if(!dateValue)return;
let currentStart=document.getElementById("start").value;
if(currentStart)return;

let settingsData=localStorage.getItem("soukouSettings");
if(!settingsData)return;
let settings=JSON.parse(settingsData);
let reports=JSON.parse(localStorage.getItem("soukouReports"))||[];

let previousReports=reports.filter(function(report){
return report.date&&report.date<dateValue&&report.car===settings.car&&report.end!==undefined&&report.end!==null&&report.end!=="";
});

previousReports.sort(function(a,b){
if(a.date!==b.date)return b.date.localeCompare(a.date);
return Number(b.end)-Number(a.end);
});

if(previousReports.length===0)return;
document.getElementById("start").value=previousReports[0].end;
calculateDistance();
saveDraft();
}

function toggleSettings(){
let el=document.getElementById("settings");
if(el.style.display==="block"){
el.style.display="none";
}else{
el.style.display="block";
loadSettings();
}
}

function saveSettings(){
let company=document.getElementById("settingCompany").value.trim();
let car=document.getElementById("settingCar").value.trim();
let driver=document.getElementById("settingDriver").value.trim();

if(!company||!car||!driver){
alert("会社名・車番・運転者名を入力してください");
return;
}

localStorage.setItem("soukouSettings",JSON.stringify({company,car,driver}));
updateHeader();
document.getElementById("settings").style.display="none";
document.getElementById("start").value="";
loadPreviousMileage();
updateOilManagement();
updateFuelManagement();
alert("基本情報を保存しました！");
}

function loadSettings(){
let saved=localStorage.getItem("soukouSettings");
if(!saved){
document.getElementById("settingCompany").value="";
document.getElementById("settingCar").value="";
document.getElementById("settingDriver").value="";
return;
}
let settings=JSON.parse(saved);
document.getElementById("settingCompany").value=settings.company||"";
document.getElementById("settingCar").value=settings.car||"";
document.getElementById("settingDriver").value=settings.driver||"";
}

function updateHeader(){
let saved=localStorage.getItem("soukouSettings");
if(!saved){
document.getElementById("headerCompany").textContent="会社名未設定";
document.getElementById("headerCar").textContent="未設定";
document.getElementById("headerDriver").textContent="未設定";
return;
}
let settings=JSON.parse(saved);
document.getElementById("headerCompany").textContent=settings.company||"会社名未設定";
document.getElementById("headerCar").textContent=settings.car||"未設定";
document.getElementById("headerDriver").textContent=settings.driver||"未設定";
}

function calculateDistance(){
let start=Number(document.getElementById("start").value);
let end=Number(document.getElementById("returnMileage").value);
document.getElementById("distance").value=end>=start&&start>0?(end-start)+" km":"";
}

function saveDraft(){
if(editingIndex!==-1)return;
let draft={
date:document.getElementById("date").value,
start:document.getElementById("start").value,
returnMileage:document.getElementById("returnMileage").value,
work:document.getElementById("work").value,
memo:document.getElementById("memo").value
};
localStorage.setItem("soukouDraft",JSON.stringify(draft));
}

function loadDraft(){
let saved=localStorage.getItem("soukouDraft");
if(!saved){
setToday();
loadPreviousMileage();
return;
}
let draft=JSON.parse(saved);
let today=getToday();
if(draft.date!==today){
localStorage.removeItem("soukouDraft");
setToday();
loadPreviousMileage();
return;
}
document.getElementById("date").value=draft.date||today;
document.getElementById("start").value=draft.start||"";
document.getElementById("returnMileage").value=draft.returnMileage||"";
document.getElementById("work").value=draft.work||"";
document.getElementById("memo").value=draft.memo||"";
if(!draft.start)loadPreviousMileage();
calculateDistance();
}

function setToday(){
document.getElementById("date").value=getToday();
}

function editReport(index){
let reports=JSON.parse(localStorage.getItem("soukouReports"))||[];
let report=reports[index];
if(!report)return;
editingIndex=index;
document.getElementById("date").value=report.date;
document.getElementById("start").value=report.start;
document.getElementById("returnMileage").value=report.end;
document.getElementById("work").value=report.work||"";
document.getElementById("memo").value=report.memo||"";
calculateDistance();
document.getElementById("editMode").style.display="block";
document.getElementById("saveButton").textContent="変更を保存";
document.getElementById("cancelEditButton").style.display="block";
window.scrollTo({top:0,behavior:"smooth"});
}

function cancelEdit(){
editingIndex=-1;
document.getElementById("editMode").style.display="none";
document.getElementById("saveButton").textContent="日報を保存";
document.getElementById("cancelEditButton").style.display="none";
clearInputs();
setToday();
loadPreviousMileage();
}

function clearInputs(){
document.getElementById("start").value="";
document.getElementById("returnMileage").value="";
document.getElementById("distance").value="";
document.getElementById("work").value="";
document.getElementById("memo").value="";
}

document.getElementById("start").addEventListener("input",function(){
calculateDistance();
saveDraft();
updateOilManagement();
});

document.getElementById("returnMileage").addEventListener("input",function(){
calculateDistance();
saveDraft();
updateOilManagement();
});

document.getElementById("work").addEventListener("input",saveDraft);
document.getElementById("memo").addEventListener("input",saveDraft);

document.getElementById("date").addEventListener("change",function(){
if(editingIndex!==-1)return;
document.getElementById("start").value="";
document.getElementById("returnMileage").value="";
document.getElementById("distance").value="";
saveDraft();
loadPreviousMileage();
});

function save(){
let settingsData=localStorage.getItem("soukouSettings");
if(!settingsData){
alert("先に「基本情報を変更」から\n会社名・車番・運転者名を設定してください");
document.getElementById("settings").style.display="block";
loadSettings();
return;
}

let settings=JSON.parse(settingsData);
let dateValue=document.getElementById("date").value;
let start=Number(document.getElementById("start").value);
let end=Number(document.getElementById("returnMileage").value);
let work=document.getElementById("work").value;
let memo=document.getElementById("memo").value;

if(!dateValue||!start||!end){
alert("日付・出発時走行距離・帰社時走行距離を入力してください");
return;
}
if(end<start){
alert("帰社時走行距離は、出発時走行距離以上にしてください");
return;
}

let distance=end-start;
let reports=JSON.parse(localStorage.getItem("soukouReports"))||[];

let report={
company:settings.company,
date:dateValue,
car:settings.car,
start:start,
end:end,
distance:distance,
driver:settings.driver,
work:work,
memo:memo
};

if(editingIndex!==-1){
reports[editingIndex]=report;
localStorage.setItem("soukouReports",JSON.stringify(reports));
alert("日報を変更しました！");
editingIndex=-1;
document.getElementById("editMode").style.display="none";
document.getElementById("saveButton").textContent="日報を保存";
document.getElementById("cancelEditButton").style.display="none";
clearInputs();
localStorage.removeItem("soukouDraft");
setToday();
displayReports();
loadPreviousMileage();
updateOilManagement();
updateFuelManagement();
if(document.getElementById("monthlyList").style.display==="block")showMonthlyList();
return;
}

reports.push(report);
localStorage.setItem("soukouReports",JSON.stringify(reports));
localStorage.removeItem("soukouDraft");
displayReports();
alert("日報を保存しました！");
clearInputs();
setToday();
loadPreviousMileage();
updateOilManagement();
updateFuelManagement();
if(document.getElementById("monthlyList").style.display==="block")showMonthlyList();
}

function deleteReport(index){
if(!confirm("この日報を削除しますか？"))return;
let reports=JSON.parse(localStorage.getItem("soukouReports"))||[];
reports.splice(index,1);
localStorage.setItem("soukouReports",JSON.stringify(reports));
displayReports();
showMonthlyList();
updateOilManagement();
updateFuelManagement();
alert("日報を削除しました");
}

function displayReports(){
let reports=JSON.parse(localStorage.getItem("soukouReports"))||[];
let list=document.getElementById("list");
list.innerHTML="";

if(reports.length===0){
list.innerHTML='<div class="no-saved-reports">まだ保存された日報はありません</div>';
return;
}

let sortedReports=reports.map(function(report,index){return{report,index};});
sortedReports.sort(function(a,b){return b.report.date.localeCompare(a.report.date);});

let groups={};
sortedReports.forEach(function(item){
let month=item.report.date?item.report.date.substring(0,7):"不明";
if(!groups[month])groups[month]=[];
groups[month].push(item);
});

let months=Object.keys(groups).sort(function(a,b){return b.localeCompare(a);});
let currentMonth=getToday().substring(0,7);

months.forEach(function(month){
let items=groups[month];
let isCurrentMonth=month===currentMonth;
let monthLabel="年月不明";
if(month.length===7){
monthLabel=month.substring(0,4)+"年"+Number(month.substring(5,7))+"月";
}
let monthId="savedMonth_"+month.replace(/[^0-9]/g,"");
let contentClass=isCurrentMonth?"saved-month-content open":"saved-month-content";
let arrow=isCurrentMonth?"▼":"▶";

let html='<div class="saved-month">';
html+='<button class="saved-month-header" onclick="toggleSavedMonth(\''+monthId+'\',this)">';
html+=arrow+' 📅 '+monthLabel+' <span class="saved-month-count">（'+items.length+'件）</span></button>';
html+='<div id="'+monthId+'" class="'+contentClass+'">';

items.forEach(function(item){
let report=item.report;
let index=item.index;
html+='<div class="saved-report-card">';
html+='<div class="saved-report-date">'+formatDateWithDay(report.date)+'</div>';
html+='運転者：<strong>'+escapeHtml(report.driver||"")+'</strong><br>';
html+='車番：<strong>'+escapeHtml(report.car||"")+'</strong><br>';
html+='出発：<strong>'+escapeHtml(report.start||"")+'</strong> km<br>';
html+='帰社：<strong>'+escapeHtml(report.end||"")+'</strong> km<br>';
html+='<span class="saved-report-distance">走行距離：'+escapeHtml(report.distance||0)+' km</span><br>';
html+='運行内容：'+escapeHtml(report.work||"");
if(report.memo)html+='<br>備考：'+escapeHtml(report.memo);
html+='<div class="saved-report-actions">';
html+='<button class="saved-edit-button" onclick="editReport('+index+')">✏️ 編集</button>';
html+='<button class="saved-delete-button" onclick="deleteReport('+index+')">🗑️ 削除</button>';
html+='</div></div>';
});
html+='</div></div>';
list.innerHTML+=html;
});
}

function escapeHtml(value){
return String(value).replace(/[&<>"']/g,function(c){
return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
});
}

function toggleSavedMonth(monthId,button){
let content=document.getElementById(monthId);
if(!content)return;
if(content.classList.contains("open")){
content.classList.remove("open");
button.textContent=button.textContent.replace("▼","▶");
}else{
content.classList.add("open");
button.textContent=button.textContent.replace("▶","▼");
}
}

/* オイル交換 */

function getOilRecords(){
return JSON.parse(localStorage.getItem("soukouOilRecords"))||[];
}

function toggleOilManagement(){
let management=document.getElementById("oilManagement");
let button=document.getElementById("oilToggleButton");
if(management.style.display==="block"){
management.style.display="none";
button.textContent="🛢️ オイル交換管理を見る";
}else{
updateOilManagement();
management.style.display="block";
button.textContent="📕 オイル交換管理を閉じる";
}
}

function saveOilChange(){
let mileage=Number(document.getElementById("oilChangeMileage").value);
if(!mileage||mileage<=0){
alert("オイル交換時の走行距離を入力してください");
return;
}
let settingsData=localStorage.getItem("soukouSettings");
if(!settingsData){

}

function getCurrentMileage(){
let reports=JSON.parse(localStorage.getItem("soukouReports"))||[];
let settingsData=localStorage.getItem("soukouSettings");
if(!settingsData)return 0;
let settings=JSON.parse(settingsData);
let mileageList=[];

reports.forEach(function(report){
if(report.car===settings.car&&report.end!==undefined&&report.end!==null&&report.end!==""){
mileageList.push(Number(report.end));
}
});

getOilRecords().forEach(function(record){
if((!record.car||!settings.car||record.car===settings.car)&&record.mileage!==undefined&&record.mileage!==null&&record.mileage!==""){
mileageList.push(Number(record.mileage));
}
});

let currentInput=Number(document.getElementById("returnMileage").value);
if(currentInput>0)mileageList.push(currentInput);
if(mileageList.length===0)return 0;
return Math.max.apply(null,mileageList);
}

function updateOilManagement(){
let currentMileage=getCurrentMileage();
let currentElement=document.getElementById("oilCurrentMileage");
currentElement.textContent=currentMileage>0?currentMileage.toLocaleString():"---";

let records=getOilRecords();
let nextElement=document.getElementById("oilNextMileage");
let warningElement=document.getElementById("oilWarning");
let okElement=document.getElementById("oilOk");
warningElement.style.display="none";
okElement.style.display="none";

let settingsData=localStorage.getItem("soukouSettings");
let settings=settingsData?JSON.parse(settingsData):{};
let carRecords=records.filter(function(record){
return !record.car||!settings.car||record.car===settings.car;
});

if(carRecords.length===0){
nextElement.textContent="未登録";
document.getElementById("oilHistory").innerHTML="";
return;
}

carRecords.sort(function(a,b){
if(a.date!==b.date)return a.date.localeCompare(b.date);
return Number(a.mileage)-Number(b.mileage);
});

let latest=carRecords[carRecords.length-1];
let nextMileage=Number(latest.nextMileage);
nextElement.textContent=nextMileage.toLocaleString()+" km";

if(currentMileage>0){
let remaining=nextMileage-currentMileage;
if(remaining<=0){
warningElement.style.display="block";
warningElement.textContent="🚨 オイル交換時期を超えています！ "+Math.abs(remaining).toLocaleString()+" km 超過";
}else if(remaining<=500){
warningElement.style.display="block";
warningElement.textContent="⚠️ オイル交換まであと "+remaining.toLocaleString()+" km です！";
}else{
okElement.style.display="block";
okElement.textContent="オイル交換まであと "+remaining.toLocaleString()+" km";
}
}

let historyHtml='<h3 style="color:#e65100;">🛢️ オイル交換履歴</h3>';
carRecords.slice().reverse().forEach(function(record){
let originalIndex=records.indexOf(record);
historyHtml+='<div style="background:white;border:1px solid #ddd;border-radius:8px;padding:10px;margin-top:8px;">';
historyHtml+=formatDateWithDay(record.date)+'<br>交換時：<strong>'+Number(record.mileage).toLocaleString()+' km</strong>';

});

}

/* 給油管理 */

function getFuelRecords(){
return JSON.parse(localStorage.getItem("soukouFuelRecords"))||[];
}

let button=document.getElementById("fuelToggleButton");

}else{

management.style.display="block";
button.textContent="📕 給油管理を閉じる";
}
}

function getFuelEconomy(record){
if(!record)return null;
let records=getFuelRecords();
let targetCar=record.car||"";
let carRecords=records.filter(function(item){
return item.mileage!==undefined&&item.mileage!==null&&item.mileage!==""&&(!targetCar||!item.car||item.car===targetCar);
});
carRecords.sort(function(a,b){
if(a.date!==b.date)return a.date.localeCompare(b.date);
return Number(a.mileage)-Number(b.mileage);
});
let previousRecords=carRecords.filter(function(item){
if(item.date<record.date)return true;
if(item.date===record.date)return Number(item.mileage)<Number(record.mileage);
return false;
});
if(previousRecords.length===0)return null;
previousRecords.sort(function(a,b){
if(a.date!==b.date)return b.date.localeCompare(a.date);
return Number(b.mileage)-Number(a.mileage);
});
let previous=previousRecords[0];
let distance=Number(record.mileage)-Number(previous.mileage);
let liters=Number(record.liters);
if(distance<=0||liters<=0)return null;
return distance/liters;
}

function saveFuel(){
let mileage=Number(document.getElementById("fuelMileage").value);
let liters=Number(document.getElementById("fuelLiters").value);
if(!mileage||mileage<=0){
alert("給油時走行距離を入力してください");
return;
}
if(!liters||liters<=0){
alert("給油量（L）を入力してください");
return;
}
let settingsData=localStorage.getItem("soukouSettings");
if(!settingsData){
alert("先に基本情報を設定してください");
return;
}
let settings=JSON.parse(settingsData);
let dateValue=document.getElementById("date").value||getToday();
let records=getFuelRecords();

let laterRecord=records.find(function(record){
return record.car===settings.car&&Number(record.mileage)>mileage;
});

if(laterRecord){
let ok=confirm("今回の走行距離より大きい給油記録があります。\n\n今回："+mileage.toLocaleString()+" km\n既存："+Number(laterRecord.mileage).toLocaleString()+" km\n\nこのまま記録しますか？");
if(!ok)return;
}

let newRecord={date:dateValue,mileage,liters,car:settings.car,driver:settings.driver};
records.push(newRecord);
localStorage.setItem("soukouFuelRecords",JSON.stringify(records));
document.getElementById("fuelMileage").value="";
document.getElementById("fuelLiters").value="";
updateFuelManagement();
if(document.getElementById("monthlyList").style.display==="block")showMonthlyList();

let economy=getFuelEconomy(newRecord);
if(economy){
alert("給油を記録しました！\n\n給油時："+mileage.toLocaleString()+" km\n給油量："+liters.toFixed(1)+" L\n燃費："+economy.toFixed(1)+" km/L");
}else{
alert("給油を記録しました！\n\n給油時："+mileage.toLocaleString()+" km\n給油量："+liters.toFixed(1)+" L\n\n※前回の給油記録がないため、燃費は次回から計算します");
}
}

function deleteFuelRecord(index){
if(!confirm("この給油記録を削除しますか？"))return;
let records=getFuelRecords();
records.splice(index,1);
localStorage.setItem("soukouFuelRecords",JSON.stringify(records));
updateFuelManagement();
if(document.getElementById("monthlyList").style.display==="block")showMonthlyList();
}

function updateFuelManagement(){
let records=getFuelRecords();
let settingsData=localStorage.getItem("soukouSettings");
let settings=settingsData?JSON.parse(settingsData):{};
let carRecords=records.filter(function(record){
return !record.car||!settings.car||record.car===settings.car;
});

carRecords.sort(function(a,b){
if(a.date!==b.date)return b.date.localeCompare(a.date);
return Number(b.mileage)-Number(a.mileage);
});

let historyHtml='<h3 style="color:#1565c0;">⛽ 給油履歴</h3>';

if(carRecords.length===0){
historyHtml+='<div class="fuel-history-item">まだ給油記録がありません</div>';
}else{
carRecords.forEach(function(record){
let originalIndex=records.indexOf(record);
let economy=getFuelEconomy(record);
historyHtml+='<div class="fuel-history-item">'+formatDateWithDay(record.date);
historyHtml+='<br>給油時走行距離：<strong>'+Number(record.mileage).toLocaleString()+' km</strong>';
historyHtml+='<br>給油量：<strong>'+Number(record.liters).toFixed(1)+' L</strong><br>';
if(economy){
historyHtml+='燃費：<span class="fuel-economy">'+economy.toFixed(1)+' km/L</span>';
}else{
historyHtml+='燃費：前回記録なし';
}
historyHtml+='<br><button class="fuel-delete" onclick="deleteFuelRecord('+originalIndex+')">削除</button></div>';
});
}
document.getElementById("fuelHistory").innerHTML=historyHtml;
}

/* 日報の日付に対応するオイル交換・給油 */

function getOilText(dateValue,car){
let records=getOilRecords();
let matching=records.filter(function(record){
return record.date===dateValue&&(!car||!record.car||record.car===car);
});
if(matching.length===0)return "";
let text="";
matching.forEach(function(record){
if(text)text+="<br>";
text+="🛢️ "+Number(record.mileage).toLocaleString()+"km";
});
return text;
}

function getFuelText(dateValue,car){
let records=getFuelRecords();
let matching=records.filter(function(record){
return record.date===dateValue&&(!car||!record.car||record.car===car);
});
if(matching.length===0)return "";
let text="";
matching.forEach(function(record){
if(text)text+="<br>";
text+="⛽ "+Number(record.liters).toFixed(1)+"L";
let economy=getFuelEconomy(record);
if(economy)text+="<br>"+economy.toFixed(1)+" km/L";
});
return text;
}

/* 月間燃費 */

function getMonthlyFuelEconomy(month){
let records=getFuelRecords();
let settingsData=localStorage.getItem("soukouSettings");
if(!settingsData)return null;
let settings=JSON.parse(settingsData);

let carRecords=records.filter(function(record){
return record.car===settings.car&&record.mileage!==undefined&&record.mileage!==null&&record.mileage!=="";
});

carRecords.sort(function(a,b){
if(a.date!==b.date)return a.date.localeCompare(b.date);
return Number(a.mileage)-Number(b.mileage);
});

let totalFuelDistance=0;
let totalLiters=0;

carRecords.forEach(function(record,index){
if(!record.date.startsWith(month)||index===0)return;
let previous=carRecords[index-1];
let distance=Number(record.mileage)-Number(previous.mileage);
let liters=Number(record.liters);
if(distance>0&&liters>0){
totalFuelDistance+=distance;
totalLiters+=liters;
}
});

if(totalLiters<=0)return null;
return totalFuelDistance/totalLiters;
}
