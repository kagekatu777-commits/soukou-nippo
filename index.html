📋 保存済み日報

</h2>


<table>

<thead>

<tr>

<th>日付</th>
<th>運転者</th>
<th>車番</th>

<script>


// =====================================
// 編集中の日報番号
// =====================================

let editingIndex = -1;


// =====================================
// 今日の日付
// =====================================

function getToday(){

    let today = new Date();

    let year =
        today.getFullYear();

    let month =
        String(today.getMonth() + 1)
        .padStart(2,"0");

    let day =
        String(today.getDate())
        .padStart(2,"0");

    return year + "-" + month + "-" + day;

}


// =====================================
// 曜日を取得
// =====================================

function getDayOfWeek(dateString){

    if(!dateString){
        return "";
    }

    let date =
        new Date(dateString + "T00:00:00");

    let days = [
        "日",
        "月",
        "火",
        "水",
        "木",
        "金",
        "土"
    ];

    return days[date.getDay()];

}


// =====================================
// 日付＋曜日表示
// =====================================

function formatDateWithDay(dateString){

    if(!dateString){
        return "";
    }

    let parts =
        dateString.split("-");

    if(parts.length !== 3){
        return dateString;
    }

    let year =
        parts[0];

    let month =
        parts[1];

    let day =
        parts[2];

    let dayOfWeek =
        getDayOfWeek(dateString);

    return (
        year +
        "/" +
        month +
        "/" +
        day +
        "（" +
        dayOfWeek +
        "）"
    );

}


// =====================================
// 前日の日付
// =====================================

function getPreviousDate(dateString){

    let date =
        new Date(dateString + "T00:00:00");

    date.setDate(
        date.getDate() - 1
    );

    let year =
        date.getFullYear();

    let month =
        String(date.getMonth() + 1)
        .padStart(2,"0");

    let day =
        String(date.getDate())
        .padStart(2,"0");

    return year + "-" + month + "-" + day;

}


// =====================================
// 今日の日付をセット
// =====================================

function setToday(){

    document.getElementById("date").value =
        getToday();

}


// =====================================
// 前日の帰社距離を自動入力
// =====================================

function loadPreviousMileage(){

    let date =
        document.getElementById("date").value;

    if(!date){
        return;
    }

    if(editingIndex !== -1){
        return;
    }

    let currentStart =
        document.getElementById("start").value;

    if(currentStart){
        return;
    }

    let settingsData =
        localStorage.getItem("soukouSettings");

    if(!settingsData){
        return;
    }

    let settings =
        JSON.parse(settingsData);

    let reports =
        JSON.parse(
            localStorage.getItem("soukouReports")
        ) || [];

    let previousDate =
        getPreviousDate(date);

    let previousReports =
        reports.filter(function(report){

            return (
                report.date === previousDate &&
                report.car === settings.car
            );

        });

    if(previousReports.length === 0){
        return;
    }

    let previousReport =
        previousReports[
            previousReports.length - 1
        ];

    if(
        previousReport.end !== undefined &&
        previousReport.end !== null &&
        previousReport.end !== ""
    ){

        document.getElementById("start").value =
            previousReport.end;

        calculateDistance();

        saveDraft();

    }

}


// =====================================
// 設定画面
// =====================================

function toggleSettings(){

    let settings =
        document.getElementById("settings");

    if(settings.style.display === "block"){

        settings.style.display = "none";

    }else{

        settings.style.display = "block";

        loadSettings();

    }

}


// =====================================
// 基本情報保存
// =====================================

function saveSettings(){

    let company =
        document.getElementById(
            "settingCompany"
        ).value.trim();

    let car =
        document.getElementById(
            "settingCar"
        ).value.trim();

    let driver =
        document.getElementById(
            "settingDriver"
        ).value.trim();

    if(!company || !car || !driver){

        alert(
            "会社名・車番・運転者名を入力してください"
        );

        return;

    }

    let settings = {

        company:company,
        car:car,
        driver:driver

    };

    localStorage.setItem(
        "soukouSettings",
        JSON.stringify(settings)
    );

    updateHeader();

    document.getElementById(
        "settings"
    ).style.display = "none";

    document.getElementById("start").value = "";

    loadPreviousMileage();

    loadOilSetting();

    alert(
        "基本情報を保存しました！"
    );

}


// =====================================
// 基本情報読み込み
// =====================================

function loadSettings(){

    let saved =
        localStorage.getItem("soukouSettings");

    if(!saved){

        document.getElementById(
            "settingCompany"
        ).value = "";

        document.getElementById(
            "settingCar"
        ).value = "";

        document.getElementById(
            "settingDriver"
        ).value = "";

        return;

    }

    let settings =
        JSON.parse(saved);

    document.getElementById(
        "settingCompany"
    ).value =
        settings.company || "";

    document.getElementById(
        "settingCar"
    ).value =
        settings.car || "";

    document.getElementById(
        "settingDriver"
    ).value =
        settings.driver || "";

}


// =====================================
// ヘッダー更新
// =====================================

function updateHeader(){

    let saved =
        localStorage.getItem("soukouSettings");

    if(!saved){

        document.getElementById(
            "headerCompany"
        ).textContent =
            "会社名未設定";

        document.getElementById(
            "headerCar"
        ).textContent =
            "未設定";

        document.getElementById(
            "headerDriver"
        ).textContent =
            "未設定";

        return;

    }

    let settings =
        JSON.parse(saved);

    document.getElementById(
        "headerCompany"
    ).textContent =
        settings.company ||
        "会社名未設定";

    document.getElementById(
        "headerCar"
    ).textContent =
        settings.car ||
        "未設定";

    document.getElementById(
        "headerDriver"
    ).textContent =
        settings.driver ||
        "未設定";

}


// =====================================
// オイル交換管理 開閉
// =====================================

function toggleOilSection(){

    let section =
        document.getElementById(
            "oilSection"
        );

    let button =
        document.querySelector(
            ".oil-toggle-button"
        );

    if(section.style.display === "block"){

        section.style.display = "none";

        button.textContent =
            "🛢️ オイル交換管理";

    }else{

        section.style.display = "block";

        button.textContent =
            "📕 オイル交換管理を閉じる";

        loadOilSetting();

    }

}


// =====================================
// オイル交換設定の保存
// =====================================

function saveOilSetting(){

    let settingsData =
        localStorage.getItem(
            "soukouSettings"
        );

    if(!settingsData){

        alert(
            "先に基本情報を設定してください"
        );

        return;

    }

    let settings =
        JSON.parse(settingsData);

    let car =
        settings.car;

    let nextMileage =
        Number(
            document.getElementById(
                "oilNextMileage"
            ).value
        );

    if(!nextMileage || nextMileage <= 0){

        alert(
            "次回オイル交換距離を入力してください"
        );

        return;

    }

    let oilData =
        JSON.parse(
            localStorage.getItem(
                "soukouOilSettings"
            )
        ) || {};

    oilData[car] = {

        nextMileage:nextMileage

    };

    localStorage.setItem(
        "soukouOilSettings",
        JSON.stringify(oilData)
    );

    loadOilSetting();

    alert(
        "次回オイル交換距離を保存しました！"
    );

}


// =====================================
// オイル交換設定読み込み
// =====================================

function loadOilSetting(){

    let settingsData =
        localStorage.getItem(
            "soukouSettings"
        );

    if(!settingsData){

        document.getElementById(
            "oilNextMileage"
        ).value = "";

        document.getElementById(
            "oilNextDisplay"
        ).textContent =
            "未設定";

        document.getElementById(
            "oilCurrentDisplay"
        ).textContent =
            "未取得";

        document.getElementById(
            "oilStatus"
        ).textContent =
            "車番を設定してください";

        return;

    }

    let settings =
        JSON.parse(settingsData);

    let car =
        settings.car;

    let oilData =
        JSON.parse(
            localStorage.getItem(
                "soukouOilSettings"
            )
        ) || {};

    let oil =
        oilData[car];

    if(!oil){

        document.getElementById(
            "oilNextMileage"
        ).value = "";

        document.getElementById(
            "oilNextDisplay"
        ).textContent =
            "未設定";

        document.getElementById(
            "oilCurrentDisplay"
        ).textContent =
            getCurrentMileageDisplay();

        updateOilStatus();

        return;

    }

    document.getElementById(
        "oilNextMileage"
    ).value =
        oil.nextMileage;

    document.getElementById(
        "oilNextDisplay"
    ).textContent =
        Number(oil.nextMileage).toLocaleString() +
        " km";

    document.getElementById(
        "oilCurrentDisplay"
    ).textContent =
        getCurrentMileageDisplay();

    updateOilStatus();

}


// =====================================
// 最新の走行距離を取得
// =====================================

function getCurrentMileage(){

    let settingsData =
        localStorage.getItem(
            "soukouSettings"
        );

    if(!settingsData){
        return null;
    }

    let settings =
        JSON.parse(settingsData);

    let reports =
        JSON.parse(
            localStorage.getItem(
                "soukouReports"
            )
        ) || [];

    let carReports =
        reports.filter(function(report){

            return report.car === settings.car &&
                   report.end !== undefined &&
                   report.end !== null &&
                   report.end !== "";

        });

    if(carReports.length === 0){
        return null;
    }

    carReports.sort(function(a,b){

        if(a.date === b.date){

            return reports.indexOf(b) -
                   reports.indexOf(a);

        }

        return b.date.localeCompare(a.date);

    });

    return Number(
        carReports[0].end
    );

}


// =====================================
// 現在距離表示
// =====================================

function getCurrentMileageDisplay(){

    let current =
        getCurrentMileage();

    if(
        current === null ||
        isNaN(current)
    ){

        return "未取得";

    }

    return (
        current.toLocaleString() +
        " km"
    );

}


// =====================================
// オイル交換状態更新
// =====================================

function updateOilStatus(){

    let settingsData =
        localStorage.getItem(
            "soukouSettings"
        );

    let status =
        document.getElementById(
            "oilStatus"
        );

    if(!settingsData){

        status.className =
            "oil-status oil-warning";

        status.textContent =
            "基本情報を設定してください";

        return;

    }

    let settings =
        JSON.parse(settingsData);

    let oilData =
        JSON.parse(
            localStorage.getItem(
                "soukouOilSettings"
            )
        ) || {};

    let oil =
        oilData[settings.car];

    let current =
        getCurrentMileage();

    if(!oil){

        status.className =
            "oil-status oil-warning";

        status.textContent =
            "次回オイル交換距離を設定してください";

        return;

    }

    if(
        current === null ||
        isNaN(current)
    ){

        status.className =
            "oil-status oil-normal";

        status.textContent =
            "日報を保存すると交換時期を確認できます";

        return;

    }

    let remaining =
        Number(oil.nextMileage) - current;

    if(remaining <= 0){

        status.className =
            "oil-status oil-danger";

        status.textContent =
            "🚨 オイル交換時期です！ " +
            Math.abs(remaining).toLocaleString() +
            " km超過";

    }else if(remaining <= 500){

        status.className =
            "oil-status oil-warning";

        status.textContent =
            "⚠️ オイル交換まであと " +
            remaining.toLocaleString() +
            " km";

    }else{

        status.className =
            "oil-status oil-normal";

        status.textContent =
            "オイル交換まであと " +
            remaining.toLocaleString() +
            " km";

    }

}


// =====================================
// オイル交換完了
// =====================================

function completeOilChange(){

    let settingsData =
        localStorage.getItem(
            "soukouSettings"
        );

    if(!settingsData){

        alert(
            "先に基本情報を設定してください"
        );

        return;

    }

    let settings =
        JSON.parse(settingsData);

    let current =
        getCurrentMileage();

    if(
        current === null ||
        isNaN(current)
    ){

        alert(
            "現在の走行距離がまだありません。\n" +
            "日報を保存してからオイル交換完了を押してください。"
        );

        return;

    }

    let message =
        "現在の走行距離 " +
        current.toLocaleString() +
        " km を基準に、\n" +
        "次回オイル交換距離を設定します。\n\n" +
        "よろしいですか？";

    if(!confirm(message)){
        return;
    }

    let oilData =
        JSON.parse(
            localStorage.getItem(
                "soukouOilSettings"
            )
        ) || {};

    oilData[settings.car] = {

        nextMileage:current

    };

    localStorage.setItem(
        "soukouOilSettings",
        JSON.stringify(oilData)
    );

    loadOilSetting();

    alert(
        "オイル交換完了として記録しました！\n\n" +
        "次回交換距離：" +
        current.toLocaleString() +
        " km"
    );

}


// =====================================
// 走行距離計算
// =====================================

function calculateDistance(){

    let start =
        Number(
            document.getElementById(
                "start"
            ).value
        );

    let end =
        Number(
            document.getElementById(
                "returnMileage"
            ).value
        );

    if(
        end >= start &&
        start > 0
    ){

        document.getElementById(
            "distance"
        ).value =
            (end - start) + " km";

    }else{

        document.getElementById(
            "distance"
        ).value = "";

    }

}


// =====================================
// 下書き保存
// =====================================

function saveDraft(){

    if(editingIndex !== -1){
        return;
    }

    let draft = {

        date:
            document.getElementById("date").value,

        start:
            document.getElementById("start").value,

        returnMileage:
            document.getElementById(
                "returnMileage"
            ).value,

        work:
            document.getElementById("work").value,

        memo:
            document.getElementById("memo").value

    };

    localStorage.setItem(
        "soukouDraft",
        JSON.stringify(draft)
    );

}


// =====================================
// 下書き復元
// =====================================

function loadDraft(){

    let saved =
        localStorage.getItem("soukouDraft");

    if(!saved){

        setToday();

        loadPreviousMileage();

        return;

    }

    let draft =
        JSON.parse(saved);

    let today =
        getToday();

    if(draft.date !== today){

        localStorage.removeItem(
            "soukouDraft"
        );

        setToday();

        loadPreviousMileage();

        return;

    }

    document.getElementById("date").value =
        draft.date || today;

    document.getElementById("start").value =
        draft.start || "";

    document.getElementById(
        "returnMileage"
    ).value =
        draft.returnMileage || "";

    document.getElementById("work").value =
        draft.work || "";

    document.getElementById("memo").value =
        draft.memo || "";

    if(!draft.start){

        loadPreviousMileage();

    }

    calculateDistance();

}


// =====================================
// 編集
// =====================================

function editReport(index){

    let reports =
        JSON.parse(
            localStorage.getItem(
                "soukouReports"
            )
        ) || [];

    let report =
        reports[index];

    if(!report){
        return;
    }

    editingIndex = index;

    document.getElementById("date").value =
        report.date;

    document.getElementById("start").value =
        report.start;

    document.getElementById(
        "returnMileage"
    ).value =
        report.end;

    document.getElementById("work").value =
        report.work || "";

    document.getElementById("memo").value =
        report.memo || "";

    calculateDistance();

    document.getElementById(
        "editMode"
    ).style.display = "block";

    document.getElementById(
        "saveButton"
    ).textContent =
        "変更を保存";

    document.getElementById(
        "cancelEditButton"
    ).style.display =

        top:0,

    });

}

// =====================================
// 入力中のオイル表示更新
// =====================================

function updateOilDisplayAfterInput(){

    let currentInput =
        Number(
            document.getElementById(
                "returnMileage"
            ).value
        );

    if(
        !currentInput ||
        currentInput <= 0
    ){

        loadOilSetting();

        return;

    }

    document.getElementById(
        "oilCurrentDisplay"
    ).textContent =
        currentInput.toLocaleString() +
        " km";

    let settingsData =
        localStorage.getItem(
            "soukouSettings"
        );

    if(!settingsData){
        return;
    }

    let settings =
        JSON.parse(settingsData);

    let oilData =
        JSON.parse(
            localStorage.getItem(
                "soukouOilSettings"
            )
        ) || {};

    let oil =
        oilData[settings.car];

    let status =
        document.getElementById(
            "oilStatus"
        );

    if(!oil){

        status.className =
            "oil-status oil-warning";

        status.textContent =
            "次回オイル交換距離を設定してください";

        return;

    }

    let remaining =
        Number(oil.nextMileage) -
        currentInput;

    if(remaining <= 0){

        status.className =
            "oil-status oil-danger";

        status.textContent =
            "🚨 オイル交換時期です！ " +
            Math.abs(remaining).toLocaleString() +
            " km超過";

    }else if(remaining <= 500){

        status.className =
            "oil-status oil-warning";

        status.textContent =
            "⚠️ オイル交換まであと " +
            remaining.toLocaleString() +
            " km";

    }else{

        status.className =
            "oil-status oil-normal";

        status.textContent =
            "オイル交換まであと " +
            remaining.toLocaleString() +
            " km";

    }

}

// =====================================
// 日報保存
// =====================================

function save(){

    let settingsData =
        localStorage.getItem(
            "soukouSettings"
        );

    if(!settingsData){

        alert(
            "先に「基本情報を変更」から\n" +
            "会社名・車番・運転者名を設定してください"
        );

        document.getElementById(
            "settings"
        ).style.display =
            "block";

        loadSettings();

        return;

    }

    let settings =
        JSON.parse(settingsData);

    let date =
        document.getElementById("date").value;

    let start =
        Number(
            document.getElementById("start").value
        );

    let end =
        Number(
            document.getElementById(
                "returnMileage"
            ).value
        );

    let work =
        document.getElementById("work").value;

    let memo =
        document.getElementById("memo").value;

    if(
        !date ||
        !start ||
        !end
    ){

        alert(
            "日付・出発時走行距離・帰社時走行距離を入力してください"
        );

        return;

    }

    if(end < start){

        alert(
            "帰社時走行距離は、出発時走行距離以上にしてください"
        );

        return;

    }

    let distance =
        end - start;

    let reports =
        JSON.parse(
            localStorage.getItem(
                "soukouReports"
            )
        ) || [];


    // =================================
    // 編集保存
    // =================================

    if(editingIndex !== -1){

        reports[editingIndex] = {

            company:
                settings.company,

            date:
                date,

            car:
                settings.car,

            start:
                start,

            end:
                end,

            distance:
                distance,

            driver:
                settings.driver,

            work:
                work,

            memo:
                memo

        };

        localStorage.setItem(
            "soukouReports",
            JSON.stringify(reports)
        );

        alert(
            "日報を変更しました！"
        );

        editingIndex = -1;

        document.getElementById(
            "editMode"
        ).style.display =
            "none";

        document.getElementById(
            "saveButton"
        ).textContent =
            "日報を保存";

        document.getElementById(
            "cancelEditButton"
        ).style.display =
            "none";

        clearInputs();

        localStorage.removeItem(
            "soukouDraft"
        );

        setToday();

        displayReports();

        loadPreviousMileage();

        loadOilSetting();

        return;

    }


    // =================================
    // 新規保存
    // =================================

    let report = {

        company:
            settings.company,

        date:
            date,

        car:
            settings.car,

        start:
            start,

        end:
            end,

        distance:
            distance,

        driver:
            settings.driver,

        work:
            work,

        memo:
            memo

    };

    reports.push(report);

    localStorage.setItem(
        "soukouReports",
        JSON.stringify(reports)
    );

    localStorage.removeItem(
        "soukouDraft"
    );

    displayReports();

    loadOilSetting();

    alert(
        "日報を保存しました！"
    );

    clearInputs();

    setToday();

    loadPreviousMileage();

    loadOilSetting();

}


// =====================================
// 日報削除
// =====================================

function deleteReport(index){

    if(
        !confirm(
            "この日報を削除しますか？"
        )
    ){

        return;

    }

    let reports =
        JSON.parse(
            localStorage.getItem(
                "soukouReports"
            )
        ) || [];

    reports.splice(
        index,
        1
    );

    localStorage.setItem(
        "soukouReports",
        JSON.stringify(reports)
    );

    displayReports();

    showMonthlyList();

    loadOilSetting();

    alert(
        "日報を削除しました"
    );

}

// =====================================
// 月間一覧
// =====================================

function showMonthlyList(){

    let month =
        document.getElementById(
            "printMonth"
        ).value;

    if(!month){

        return;

    }

    let reports =
        JSON.parse(
            localStorage.getItem(
                "soukouReports"
            )
        ) || [];

    let monthlyReports =
        reports.filter(
            function(report){

                return report.date.startsWith(
                    month
                );

            }
        );

    monthlyReports.sort(
        function(a,b){

            return a.date.localeCompare(
                b.date
            );

        }
    );

    let total = 0;

    let body =
        document.getElementById(
            "monthlyListBody"
        );

    body.innerHTML = "";

    monthlyReports.forEach(
        function(report){

            total +=
                Number(report.distance) || 0;

            body.innerHTML += `

<tr>

<td>${formatDateWithDay(report.date)}</td>

<td>${report.driver || ""}</td>

<td>${report.car || ""}</td>

<td>${report.start || ""}</td>

<td>${report.end || ""}</td>

<td>${report.distance || 0} km</td>

<td>${report.work || ""}</td>

</tr>

`;

        }
    );

    if(monthlyReports.length === 0){

        body.innerHTML = `

<tr>

<td colspan="7">

この月の日報はありません

</td>

</tr>

`;

    }

    document.getElementById(
        "monthlySummary"
    ).textContent =
        "月間走行距離合計：" +
        total +
        " km";

}

function toggleMonthlyList(){

    let list =
        document.getElementById(
            "monthlyList"
        );

    let button =
        document.getElementById(
            "monthlyListButton"
        );

    if(list.style.display === "block"){

        list.style.display = "none";

        button.textContent =
            "📅 月間日報一覧を見る";

    }else{

        showMonthlyList();

        list.style.display = "block";

        button.textContent =

    }

}
