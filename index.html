<!DOCTYPE html>
<html lang="ja">

<head>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1976d2">

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>走行日報</title>

<style>

*{
    box-sizing:border-box;
}

body{
    font-family:sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:15px;
}

.card{
    background:white;
    border-radius:12px;
    padding:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}

h1{
    text-align:center;
    color:#1565c0;
    margin-bottom:10px;
}

.header-info{
    background:#e3f2fd;
    border-radius:10px;
    padding:12px;
    margin-bottom:15px;
    font-size:17px;
    line-height:1.7;
}

.header-company{
    font-size:20px;
    font-weight:bold;
}

.header-row{
    font-weight:bold;
}

.settings-button{
    width:100%;
    margin-top:10px;
    padding:10px;
    font-size:16px;
    background:#757575;
    color:white;
    border:none;
    border-radius:8px;
}

.settings{
    display:none;
    background:#f5f5f5;
    border-radius:10px;
    padding:12px;
    margin-bottom:15px;
}

.settings h2{
    margin-top:0;
    color:#1565c0;
}

label{
    display:block;
    margin-top:15px;
    font-weight:bold;
    font-size:18px;
}

input{
    width:100%;
    padding:12px;
    font-size:20px;
    border-radius:8px;
    border:1px solid #ccc;
}

button{
    width:100%;
    margin-top:20px;
    padding:15px;
    font-size:22px;
    background:#1565c0;
    color:white;
    border:none;
    border-radius:10px;
}

.settings-save{
    background:#2e7d32;
}

.distance{
    background:#eeeeee;
}

.auto-info{
    font-size:14px;
    color:#555;
    margin-top:5px;
}

.edit-mode{
    background:#fff3cd;
    border:2px solid #ff9800;
    border-radius:10px;
    padding:10px;
    margin-top:15px;
    color:#795548;
    font-weight:bold;
    text-align:center;
}

.cancel-button{
    background:#757575;
}

.monthly-print{
    margin-top:25px;
    padding:15px;
    background:#e3f2fd;
    border-radius:10px;
}

.monthly-print h2{
    margin-top:0;
    color:#1565c0;
}

.monthly-print button{
    background:#1565c0;
}

table{
    width:100%;
    margin-top:20px;
    border-collapse:collapse;
}

th,
td{
    border:1px solid #ccc;
    padding:8px;
    text-align:center;
}

th{
    background:#1565c0;
    color:white;
}

.edit-button{
    background:#2e7d32;
    color:white;
    border:none;
    border-radius:6px;
    padding:8px 10px;
    margin:0 0 5px 0;
    width:auto;
    font-size:14px;
}

.delete-button{
    background:#d32f2f;
    color:white;
    border:none;
    border-radius:6px;
    padding:8px 10px;
    margin:0;
    width:auto;
    font-size:14px;
}

.action-cell{
    white-space:nowrap;
}

.monthly-list{
    margin-top:25px;
    display:none;
}

.monthly-list h2{
    color:#1565c0;
}

.monthly-summary{
    background:#eeeeee;
    padding:12px;
    border-radius:8px;
    font-size:18px;
    font-weight:bold;
    margin-bottom:10px;
}

@media(max-width:600px){

    table{
        font-size:12px;
    }

    th,
    td{
        padding:5px;
    }

}

</style>

</head>


<body>

<div class="card">

<h1>🚚走行日報</h1>


<!-- ========================= -->
<!-- ヘッダー基本情報 -->
<!-- ========================= -->

<div class="header-info">

    <div
    class="header-company"
    id="headerCompany">

        会社名未設定

    </div>

    <div class="header-row">

        車番：
        <span id="headerCar">
            未設定
        </span>

    </div>

    <div class="header-row">

        運転者：
        <span id="headerDriver">
            未設定
        </span>

    </div>

</div>


<!-- ========================= -->
<!-- 基本情報設定 -->
<!-- ========================= -->

<button
class="settings-button"
onclick="toggleSettings()">

    ⚙ 基本情報を変更

</button>


<div
class="settings"
id="settings">

    <h2>基本情報設定</h2>

    <label>会社名</label>

    <input
    type="text"
    id="settingCompany"
    placeholder="会社名を入力">


    <label>車番</label>

    <input
    type="text"
    id="settingCar"
    placeholder="車番を入力">


    <label>運転者名</label>

    <input
    type="text"
    id="settingDriver"
    placeholder="運転者名を入力">


    <button
    class="settings-save"
    onclick="saveSettings()">

        基本情報を保存

    </button>

</div>


<!-- ========================= -->
<!-- 編集中 -->
<!-- ========================= -->

<div
id="editMode"
class="edit-mode"
style="display:none;">

    ✏️ 日報を編集中です

</div>


<!-- ========================= -->
<!-- 日報入力 -->
<!-- ========================= -->

<label>日付</label>

<input
type="date"
id="date">


<label>出発時走行距離</label>

<input
type="number"
id="start"
placeholder="前日の帰社時走行距離から自動入力">

<div class="auto-info">

    ※前日の日報が保存されている場合、自動入力されます

</div>


<label>帰社時走行距離</label>

<input
type="number"
id="returnMileage"
placeholder="帰社時の走行距離を入力">


<label>控除走行距離</label>

<input
type="text"
id="distance"
class="distance"
readonly
placeholder="自動計算">


<label>運行内容</label>

<input
type="text"
id="work"
placeholder="運行内容を入力">


<label>備考</label>

<input
type="text"
id="memo"
placeholder="備考を入力">


<button
id="saveButton"
onclick="save()">

    日報を保存

</button>


<button
id="cancelEditButton"
class="cancel-button"
onclick="cancelEdit()"
style="display:none;">

    編集をキャンセル

</button>


<!-- ========================= -->
<!-- 月間A4 PDF -->
<!-- ========================= -->

<div class="monthly-print">

    <h2>📄 月間A4 PDF</h2>

    <label>印刷する月</label>

    <input
    type="month"
    id="printMonth">


    <button
    onclick="openMonthlyPrint()">

        🖨️ A4 PDFプレビュー

    </button>

</div>


<!-- ========================= -->
<!-- 月間一覧 -->
<!-- ========================= -->

<div
class="monthly-list"
id="monthlyList">

    <h2>
        📅 月間日報一覧
    </h2>

    <div
    class="monthly-summary"
    id="monthlySummary">
    </div>

    <table>

    <thead>

    <tr>

        <th>日付</th>
        <th>運転者</th>
        <th>車番</th>
        <th>出発</th>
        <th>帰社</th>
        <th>距離</th>
        <th>運行内容</th>

    </tr>

    </thead>

    <tbody id="monthlyListBody">
    </tbody>

    </table>

</div>


<!-- ========================= -->
<!-- 保存済み一覧 -->
<!-- ========================= -->

<h2
style="color:#1565c0;margin-top:30px;">

    📋 保存済み日報

</h2>


<table>

<thead>

<tr>

<th>日付</th>
<th>運転者</th>
<th>車番</th>
<th>出発</th>
<th>帰社</th>
<th>控除走行距離</th>
<th>操作</th>

</tr>

</thead>

<tbody id="list">
</tbody>

</table>


</div>


<script>

// =====================================
// 編集中の日報番号
// =====================================

let editingIndex = -1;


// =====================================
// 今日の日付
// =====================================

function getToday(){

    let today = new Date();

    let year =
        today.getFullYear();

    let month =
        String(today.getMonth() + 1)
        .padStart(2,"0");

    let day =
        String(today.getDate())
        .padStart(2,"0");

    return year + "-" + month + "-" + day;

}


// =====================================
// 指定日の前日
// =====================================

function getPreviousDate(dateString){

    let date =
        new Date(dateString + "T00:00:00");

    date.setDate(
        date.getDate() - 1
    );

    let year =
        date.getFullYear();

    let month =
        String(date.getMonth() + 1)
        .padStart(2,"0");

    let day =
        String(date.getDate())
        .padStart(2,"0");

    return year + "-" + month + "-" + day;

}


// =====================================
// 今日の日付をセット
// =====================================

function setToday(){

    document.getElementById("date").value =
        getToday();

}


// =====================================
// 前日の帰社時走行距離を自動入力
// =====================================

function loadPreviousMileage(){

    let date =
        document.getElementById("date").value;

    if(!date){
        return;
    }


    // 編集中は自動変更しない

    if(editingIndex !== -1){
        return;
    }


    // すでに出発距離があれば変更しない

    let currentStart =
        document.getElementById("start").value;

    if(currentStart){
        return;
    }


    let settingsData =
        localStorage.getItem("soukouSettings");

    if(!settingsData){
        return;
    }


    let settings =
        JSON.parse(settingsData);


    let reports =
        JSON.parse(
            localStorage.getItem("soukouReports")
        ) || [];


    let previousDate =
        getPreviousDate(date);


    // 前日の同じ車番の日報を探す

    let previousReports =
        reports.filter(function(report){

            return (
                report.date === previousDate &&
                report.car === settings.car
            );

        });


    if(previousReports.length === 0){

        return;

    }


    // 複数ある場合は最後に保存したもの

    let previousReport =
        previousReports[
            previousReports.length - 1
        ];


    if(
        previousReport.end !== undefined &&
        previousReport.end !== null &&
        previousReport.end !== ""
    ){

        document.getElementById("start").value =
            previousReport.end;

        calculateDistance();

        saveDraft();

    }

}


// =====================================
// 基本情報設定 開閉
// =====================================

function toggleSettings(){

    let settings =
        document.getElementById("settings");


    if(settings.style.display === "block"){

        settings.style.display = "none";

    }else{

        settings.style.display = "block";

        loadSettings();

    }

}


// =====================================
// 基本情報保存
// =====================================

function saveSettings(){

    let company =
        document.getElementById(
            "settingCompany"
        ).value.trim();


    let car =
        document.getElementById(
            "settingCar"
        ).value.trim();


    let driver =
        document.getElementById(
            "settingDriver"
        ).value.trim();


    if(!company || !car || !driver){

        alert(
            "会社名・車番・運転者名を入力してください"
        );

        return;

    }


    let settings = {

        company: company,

        car: car,

        driver: driver

    };


    localStorage.setItem(
        "soukouSettings",
        JSON.stringify(settings)
    );


    updateHeader();


    document.getElementById(
        "settings"
    ).style.display = "none";


    alert(
        "基本情報を保存しました！"
    );


    // 車番変更後も前日の距離を確認

    document.getElementById("start").value = "";

    loadPreviousMileage();

}


// =====================================
// 基本情報読み込み
// =====================================

function loadSettings(){

    let saved =
        localStorage.getItem("soukouSettings");


    if(!saved){

        document.getElementById(
            "settingCompany"
        ).value = "";

        document.getElementById(
            "settingCar"
        ).value = "";

        document.getElementById(
            "settingDriver"
        ).value = "";

        return;

    }


    let settings =
        JSON.parse(saved);


    document.getElementById(
        "settingCompany"
    ).value =
        settings.company || "";


    document.getElementById(
        "settingCar"
    ).value =
        settings.car || "";


    document.getElementById(
        "settingDriver"
    ).value =
        settings.driver || "";

}


// =====================================
// ヘッダー更新
// =====================================

function updateHeader(){

    let saved =
        localStorage.getItem("soukouSettings");


    if(!saved){

        document.getElementById(
            "headerCompany"
        ).textContent =
            "会社名未設定";

        document.getElementById(
            "headerCar"
        ).textContent =
            "未設定";

        document.getElementById(
            "headerDriver"
        ).textContent =
            "未設定";

        return;

    }


    let settings =
        JSON.parse(saved);


    document.getElementById(
        "headerCompany"
    ).textContent =
        settings.company ||
        "会社名未設定";


    document.getElementById(
        "headerCar"
    ).textContent =
        settings.car ||
        "未設定";


    document.getElementById(
        "headerDriver"
    ).textContent =
        settings.driver ||
        "未設定";

}


// =====================================
// 控除走行距離計算
// =====================================

function calculateDistance(){

    let start =
        Number(
            document.getElementById(
                "start"
            ).value
        );


    let end =
        Number(
            document.getElementById(
                "returnMileage"
            ).value
        );


    if(
        end >= start &&
        start > 0
    ){

        document.getElementById(
            "distance"
        ).value =
            (end - start) + " km";

    }else{

        document.getElementById(
            "distance"
        ).value = "";

    }

}


// =====================================
// 入力途中の自動保存
// =====================================

function saveDraft(){

    if(editingIndex !== -1){
        return;
    }


    let draft = {

        date:
            document.getElementById("date").value,

        start:
            document.getElementById("start").value,

        returnMileage:
            document.getElementById(
                "returnMileage"
            ).value,

        work:
            document.getElementById("work").value,

        memo:
            document.getElementById("memo").value

    };


    localStorage.setItem(
        "soukouDraft",
        JSON.stringify(draft)
    );

}


// =====================================
// 入力途中データ復元
// =====================================

function loadDraft(){

    let saved =
        localStorage.getItem("soukouDraft");


    if(!saved){

        setToday();

        loadPreviousMileage();

        return;

    }


    let draft =
        JSON.parse(saved);


    let today =
        getToday();


    // 日付が変わっていたら
    // 昨日の途中データは破棄

    if(draft.date !== today){

        localStorage.removeItem(
            "soukouDraft"
        );

        setToday();

        loadPreviousMileage();

        return;

    }


    document.getElementById("date").value =
        draft.date || today;


    document.getElementById("start").value =
        draft.start || "";


    document.getElementById(
        "returnMileage"
    ).value =
        draft.returnMileage || "";


    document.getElementById("work").value =
        draft.work || "";


    document.getElementById("memo").value =
        draft.memo || "";


    // 出発距離が空なら前日から取得

    if(!draft.start){

        loadPreviousMileage();

    }


    calculateDistance();

}


// =====================================
// 編集開始
// =====================================

function editReport(index){

    let reports =
        JSON.parse(
            localStorage.getItem(
                "soukouReports"
            )
        ) || [];


    let report =
        reports[index];


    if(!report){
        return;
    }


    editingIndex = index;


    document.getElementById("date").value =
        report.date;


    document.getElementById("start").value =
        report.start;


    document.getElementById(
        "returnMileage"
    ).value =
        report.end;


    document.getElementById("work").value =
        report.work || "";


    document.getElementById("memo").value =
        report.memo || "";


    calculateDistance();


    document.getElementById(
        "editMode"
    ).style.display = "block";


    document.getElementById(
        "saveButton"
    ).textContent =
        "変更を保存";


    document.getElementById(
        "cancelEditButton"
    ).style.display =
        "block";


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}


// =====================================
// 編集キャンセル
// =====================================

function cancelEdit(){

    editingIndex = -1;


    document.getElementById(
        "editMode"
    ).style.display = "none";


    document.getElementById(
        "saveButton"
    ).textContent =
        "日報を保存";


    document.getElementById(
        "cancelEditButton"
    ).style.display =
        "none";


    clearInputs();


    setToday();


    loadPreviousMileage();

}


// =====================================
// 入力欄クリア
// =====================================

function clearInputs(){

    document.getElementById("start").value = "";

    document.getElementById(
        "returnMileage"
    ).value = "";

    document.getElementById(
        "distance"
    ).value = "";

    document.getElementById("work").value = "";

    document.getElementById("memo").value = "";

}


// =====================================
// 入力イベント
// =====================================

document.getElementById("start")
.addEventListener(
    "input",
    function(){

        calculateDistance();

        saveDraft();

    }
);


document.getElementById("returnMileage")
.addEventListener(
    "input",
    function(){

        calculateDistance();

        saveDraft();

    }
);


document.getElementById("work")
.addEventListener(
    "input",
    saveDraft
);


document.getElementById("memo")
.addEventListener(
    "input",
    saveDraft
);


// =====================================
// 日付変更
// =====================================

document.getElementById("date")
.addEventListener(
    "change",
    function(){

        if(editingIndex !== -1){
            return;
        }


        document.getElementById(
            "start"
        ).value = "";


        document.getElementById(
            "distance"
        ).value = "";


        saveDraft();


        loadPreviousMileage();

    }
);


// =====================================
// 日報保存
// =====================================

function save(){

    let settingsData =
        localStorage.getItem(
            "soukouSettings"
        );


    if(!settingsData){

        alert(
            "先に「基本情報を変更」から\n" +
            "会社名・車番・運転者名を設定してください"
        );


        document.getElementById(
            "settings"
        ).style.display =
            "block";


        return;

    }


    let settings =
        JSON.parse(settingsData);


    let date =
        document.getElementById("date").value;


    let start =
        Number(
            document.getElementById("start").value
        );


    let end =
        Number(
            document.getElementById(
                "returnMileage"
            ).value
        );


    let work =
        document.getElementById("work").value;


    let memo =
        document.getElementById("memo").value;


    if(
        !date ||
        !start ||
        !end
    ){

        alert(
            "日付・出発時走行距離・帰社時走行距離を入力してください"
        );

        return;

    }


    if(end < start){

        alert(
            "帰社時走行距離は、出発時走行距離以上にしてください"
        );

        return;

    }


    let distance =
        end - start;


    let reports =
        JSON.parse(
            localStorage.getItem(
                "soukou
