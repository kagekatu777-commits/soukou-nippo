HTML

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#555555">
<title>走行日報</title>

<style>
*{box-sizing:border-box}
body{font-family:sans-serif;background:#f5f5f5;margin:0;padding:15px}
.card{background:white;border-radius:12px;padding:15px;box-shadow:0 2px 8px #0002}
h1{text-align:center;color:#1565c0}
.header-info{background:#e3f2fd;border-radius:10px;padding:12px;margin-bottom:15px;font-size:17px;line-height:1.7}
.header-company{font-size:20px;font-weight:bold}
.header-row{font-weight:bold}
button{width:100%;margin-top:15px;padding:15px;font-size:20px;background:#1565c0;color:white;border:0;border-radius:10px}
label{display:block;margin-top:15px;font-weight:bold;font-size:18px}
input{width:100%;padding:12px;font-size:20px;border-radius:8px;border:1px solid #ccc}
.settings-button{background:#757575}
.settings{display:none;background:#f5f5f5;padding:12px;border-radius:10px}
.settings h2,.monthly-list h2{color:#1565c0}
.settings-save{background:#2e7d32}
.distance{background:#eee}
.auto-info{font-size:14px;color:#555;margin-top:5px}
.edit-mode{display:none;background:#fff3cd;padding:10px;margin-top:15px;text-align:center;font-weight:bold}
.cancel-button{background:#757575}
.fuel-toggle-button{margin-top:25px;background:#1976d2}
.fuel-management{display:none;margin-top:15px;padding:15px;background:#e3f2fd;border:2px solid #1976d2;border-radius:10px}
.fuel-management h2{color:#1565c0}
.fuel-save{background:#1976d2}
.fuel-history-item{background:white;border:1px solid #ddd;border-radius:8px;padding:10px;margin-top:8px;line-height:1.7}
.fuel-economy{font-size:20px;font-weight:bold;color:#1565c0}
.fuel-mark{font-weight:bold;color:#1565c0}
.fuel-delete,.oil-delete{background:#d32f2f;width:auto;padding:7px 10px;font-size:13px;margin:5px 0}
.oil-toggle-button{margin-top:25px;background:#ef6c00}
.oil-management{display:none;margin-top:15px;padding:15px;background:#fff8e1;border:2px solid #ffb300;border-radius:10px}
.oil-management h2{color:#e65100}
.oil-current{background:white;border-radius:8px;padding:12px;margin-top:10px;font-size:18px;line-height:1.8}
.oil-next{font-size:22px;font-weight:bold;color:#e65100}
.oil-warning,.oil-ok{display:none;padding:12px;border-radius:8px;margin-top:10px;font-weight:bold}
.oil-warning{background:#ffebee;border:2px solid #e53935;color:#c62828}
.oil-ok{background:#e8f5e9;border:2px solid #43a047;color:#2e7d32}
.oil-save{background:#ef6c00}
.oil-mark{font-weight:bold;color:#e65100}
.monthly-print{margin-top:25px;padding:15px;background:#e3f2fd;border-radius:10px}
.monthly-print h2{color:#1565c0;margin-top:0}
.monthly-list{display:none;margin-top:25px}
.monthly-summary{background:#eee;padding:12px;border-radius:8px;font-size:17px;font-weight:bold;margin-bottom:10px;line-height:1.8}
table{width:100%;margin-top:20px;border-collapse:collapse}
th,td{border:1px solid #ccc;padding:8px;text-align:center}
th{background:#1565c0;color:white}
.edit-button,.delete-button{width:auto;padding:8px 10px;margin:3px;font-size:14px}
.edit-button{background:#2e7d32}
.delete-button{background:#d32f2f}
.saved-reports{margin-top:30px}
.saved-reports h2{color:#1565c0}
.saved-month{margin-top:12px;border:1px solid #ccc;border-radius:10px;overflow:hidden}
.saved-month-header{margin:0;text-align:left;background:#e3f2fd;color:#1565c0;border-radius:0;font-size:19px}
.saved-month-content{display:none;padding:8px}
.saved-month-content.open{display:block}
.saved-report-card{border:1px solid #ddd;border-radius:9px;padding:10px;margin-top:8px;font-size:16px;line-height:1.7}
.saved-report-date{font-weight:bold;color:#1565c0}
.saved-report-distance{font-size:18px;font-weight:bold}
.saved-report-actions{display:flex;gap:8px}
.saved-report-actions button{flex:1}
.saved-edit-button{background:#2e7d32}
.saved-delete-button{background:#d32f2f}
.no-saved-reports{text-align:center;background:#eee;padding:15px;border-radius:8px;color:#666}
@media(max-width:600px){
table{font-size:12px}
th,td{padding:5px}
}
</style>
</head>

<body>
<div class="card">

<h1>🚚走行日報</h1>

<div class="header-info">
<div class="header-company" id="headerCompany">会社名未設定</div>
<div class="header-row">車番：<span id="headerCar">未設定</span></div>
<div class="header-row">運転者：<span id="headerDriver">未設定</span></div>
</div>

<button class="settings-button" onclick="toggleSettings()">⚙ 基本情報を変更</button>

<div class="settings" id="settings">
<h2>基本情報設定</h2>
<label>会社名</label>
<input id="settingCompany" type="text">
<label>車番</label>
<input id="settingCar" type="text">
<label>運転者名</label>
<input id="settingDriver" type="text">
<button class="settings-save" onclick="saveSettings()">基本情報を保存</button>
</div>

<div id="editMode" class="edit-mode">✏️ 日報を編集中です</div>

<label>日付</label>
<input type="date" id="date">

<label>出発時走行距離</label>
<input type="number" id="start" placeholder="前回の帰社時走行距離から自動入力">
<div class="auto-info">※休みの日があっても、直近の日報の帰社時走行距離から自動入力されます</div>

<label>帰社時走行距離</label>
<input type="number" id="returnMileage">

<label>走行距離</label>
<input type="text" id="distance" class="distance" readonly>

<label>運行内容</label>
<input type="text" id="work">

<label>備考</label>
<input type="text" id="memo">

<button id="saveButton" onclick="save()">日報を保存</button>
<button id="cancelEditButton" class="cancel-button" style="display:none" onclick="cancelEdit()">編集をキャンセル</button>

<!-- 給油管理 -->
<button id="fuelToggleButton" class="fuel-toggle-button" onclick="toggleFuelManagement()">⛽ 給油管理を見る</button>

<div class="fuel-management" id="fuelManagement">
<h2>⛽ 給油管理</h2>
<div class="auto-info">※給油したときに走行距離と給油量を入力してください</div>
<label>給油時走行距離</label>
<input type="number" id="fuelMileage">
<label>給油量（L）</label>
<input type="number" id="fuelLiters" step="0.1">
<button class="fuel-save" onclick="saveFuel()">⛽ 給油を記録</button>
<div id="fuelHistory"></div>
</div>

<!-- オイル管理 -->
<button id="oilToggleButton" class="oil-toggle-button" onclick="toggleOilManagement()">🛢️ オイル交換管理を見る</button>

<div class="oil-management" id="oilManagement">
<h2>🛢️ オイル交換管理</h2>
<div class="oil-current">
現在の走行距離：<strong id="oilCurrentMileage">---</strong> km<br>
次回オイル交換：<span class="oil-next" id="oilNextMileage">未登録</span>
</div>
<div class="oil-warning" id="oilWarning"></div>
<div class="oil-ok" id="oilOk"></div>
<label>オイル交換時の走行距離</label>
<input type="number" id="oilChangeMileage">
<div class="auto-info">※次回交換距離は交換時の走行距離＋4,000kmです</div>
<button class="oil-save" onclick="saveOilChange()">🛢️ オイル交換を記録</button>
<div id="oilHistory"></div>
</div>

<!-- 月間PDF -->
<div class="monthly-print">
<h2>📄 月間A4 PDF</h2>
<label>印刷する月</label>
<input type="month" id="printMonth">
<button onclick="openMonthlyPrint()">🖨️ A4 PDFプレビュー</button>
</div>

<button id="monthlyListButton" onclick="toggleMonthlyList()">📅 月間日報一覧を見る</button>

<div class="monthly-list" id="monthlyList">
<h2>📅 月間日報一覧</h2>
<div class="monthly-summary" id="monthlySummary"></div>
<table>
<thead>
<tr>
<th>日付</th><th>運転者</th><th>車番</th><th>出発</th><th>帰社</th><th>距離</th><th>運行内容</th><th>給油</th><th>オイル交換</th>
</tr>
</thead>
<tbody id="monthlyListBody"></tbody>
</table>
</div>

<div class="saved-reports">
<h2>📋 保存済み日報</h2>
<div id="list"></div>
</div>

</div>

<script>
let editingIndex=-1;

function getToday(){
let d=new Date();
return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

function getDayOfWeek(s){
if(!s)return "";
return ["日","月","火","水","木","金","土"][new Date(s+"T00:00:00").getDay()];
}

function formatDateWithDay(s){
if(!s)return "";
return s.replace(/-/g,"/")+"（"+getDayOfWeek(s)+"）";
}

function getReports(){
return JSON.parse(localStorage.getItem("soukouReports")||"[]");
}
function getSettings(){
return JSON.parse(localStorage.getItem("soukouSettings")||"{}");
}
function getOilRecords(){
return JSON.parse(localStorage.getItem("soukouOilRecords")||"[]");
}
function getFuelRecords(){
return JSON.parse(localStorage.getItem("soukouFuelRecords")||"[]");
}

function loadPreviousMileage(){
if(editingIndex!==-1)return;
let date=document.getElementById("date").value;
if(!date||document.getElementById("start").value)return;
let settings=getSettings();
let reports=getReports();
let previous=reports.filter(r=>r.date<date&&r.car===settings.car&&r.end!==undefined&&r.end!=="");
previous.sort((a,b)=>b.date.localeCompare(a.date)||Number(b.end)-Number(a.end));
if(previous.length){
document.getElementById("start").value=previous[0].end;
calculateDistance();
saveDraft();
}
}

function toggleSettings(){
let e=document.getElementById("settings");
e.style.display=e.style.display==="block"?"none":"block";
loadSettings();
}

function loadSettings(){
let s=getSettings();
document.getElementById("settingCompany").value=s.company||"";
document.getElementById("settingCar").value=s.car||"";
document.getElementById("settingDriver").value=s.driver||"";
}

function saveSettings(){
let company=document.getElementById("settingCompany").value.trim();
let car=document.getElementById("settingCar").value.trim();
let driver=document.getElementById("settingDriver").value.trim();
if(!company||!car||!driver){alert("会社名・車番・運転者名を入力してください");return;}
localStorage.setItem("soukouSettings",JSON.stringify({company,car,driver}));
updateHeader();
document.getElementById("settings").style.display="none";
document.getElementById("start").value="";
loadPreviousMileage();
updateOilManagement();
updateFuelManagement();
alert("基本情報を保存しました！");
}

function updateHeader(){
let s=getSettings();
document.getElementById("headerCompany").textContent=s.company||"会社名未設定";
document.getElementById("headerCar").textContent=s.car||"未設定";
document.getElementById("headerDriver").textContent=s.driver||"未設定";
}

function calculateDistance(){
let start=Number(document.getElementById("start").value);
let end=Number(document.getElementById("returnMileage").value);
document.getElementById("distance").value=end>=start&&start>0?(end-start)+" km":"";
}

function saveDraft(){
if(editingIndex!==-1)return;
let draft={
date:date.value,start:start.value,returnMileage:returnMileage.value,
work:work.value,memo:memo.value
};
localStorage.setItem("soukouDraft",JSON.stringify(draft));
}

function loadDraft(){
let d=JSON.parse(localStorage.getItem("soukouDraft")||"null");
if(!d||d.date!==getToday()){
localStorage.removeItem("soukouDraft");
setToday();
loadPreviousMileage();
return;
}
date.value=d.date||getToday();
start.value=d.start||"";
returnMileage.value=d.returnMileage||"";
work.value=d.work||"";
memo.value=d.memo||"";
calculateDistance();
if(!d.start)loadPreviousMileage();
}

function setToday(){
document.getElementById("date").value=getToday();
}

function clearInputs(){
start.value="";
returnMileage.value="";
distance.value="";
work.value="";
memo.value="";
}

function editReport(index){
let reports=getReports();
let r=reports[index];
if(!r)return;
editingIndex=index;
date.value=r.date;
start.value=r.start;
returnMileage.value=r.end;
work.value=r.work||"";
memo.value=r.memo||"";
calculateDistance();
editMode.style.display="block";
saveButton.textContent="変更を保存";
cancelEditButton.style.display="block";
window.scrollTo({top:0,behavior:"smooth"});
}

function cancelEdit(){
editingIndex=-1;
editMode.style.display="none";
saveButton.textContent="日報を保存";
cancelEditButton.style.display="none";
clearInputs();
setToday();
loadPreviousMileage();
}

start.addEventListener("input",()=>{calculateDistance();saveDraft();updateOilManagement();});
returnMileage.addEventListener("input",()=>{calculateDistance();saveDraft();updateOilManagement();});
work.addEventListener("input",saveDraft);
memo.addEventListener("input",saveDraft);
date.addEventListener("change",()=>{
if(editingIndex!==-1)return;
start.value="";
returnMileage.value="";
distance.value="";
saveDraft();
loadPreviousMileage();
});

function save(){
let settings=getSettings();
if(!settings.company||!settings.car||!settings.driver){
alert("先に基本情報を設定してください");
document.getElementById("settings").style.display="block";
loadSettings();
return;
}
let d=date.value,s=Number(start.value),e=Number(returnMileage.value);
if(!d||!s||!e){alert("日付・出発時走行距離・帰社時走行距離を入力してください");return;}
if(e<s){alert("帰社時走行距離は出発時以上にしてください");return;}
let reports=getReports();
let r={company:settings.company,date:d,car:settings.car,start:s,end:e,distance:e-s,driver:settings.driver,work:work.value,memo:memo.value};
if(editingIndex!==-1){
reports[editingIndex]=r;
alert("日報を変更しました！");
editingIndex=-1;
editMode.style.display="none";
saveButton.textContent="日報を保存";
cancelEditButton.style.display="none";
}else{
reports.push(r);
alert("日報を保存しました！");
}
localStorage.setItem("soukouReports",JSON.stringify(reports));
localStorage.removeItem("soukouDraft");
clearInputs();
setToday();
displayReports();
loadPreviousMileage();
updateOilManagement();
updateFuelManagement();
if(monthlyList.style.display==="block")showMonthlyList();
}

function deleteReport(index){
if(!confirm("この日報を削除しますか？"))return;
let reports=getReports();
reports.splice(index,1);
localStorage.setItem("soukouReports",JSON.stringify(reports));
displayReports();
showMonthlyList();
updateOilManagement();
updateFuelManagement();
alert("日報を削除しました");
}

function displayReports(){
let reports=getReports();
let list=document.getElementById("list");
list.innerHTML="";
if(!reports.length){
list.innerHTML='<div class="no-saved-reports">まだ保存された日報はありません</div>';
return;
}
let sorted=reports.map((r,i)=>({r,i})).sort((a,b)=>b.r.date.localeCompare(a.r.date));
let groups={};
sorted.forEach(x=>{
let m=x.r.date.substring(0,7);
(groups[m]||(groups[m]=[])).push(x);
});
Object.keys(groups).sort().reverse().forEach(month=>{
let items=groups[month];
let current=month===getToday().substring(0,7);
let id="savedMonth_"+month.replace(/[^0-9]/g,"");
let html=`<div class="saved-month">
<button class="saved-month-header" onclick="toggleSavedMonth('${id}',this)">${current?"▼":"▶"} 📅 ${month.replace("-","年")}月（${items.length}件）</button>
<div id="${id}" class="saved-month-content ${current?"open":""}">`;
items.forEach(x=>{
let r=x.r;
html+=`<div class="saved-report-card">
<div class="saved-report-date">${formatDateWithDay(r.date)}</div>
運転者：<strong>${escapeHTML(r.driver)}</strong><br>
車番：<strong>${escapeHTML(r.car)}</strong><br>
出発：${r.start} km<br>
帰社：${r.end} km<br>
<span class="saved-report-distance">走行距離：${r.distance} km</span><br>
運行内容：${escapeHTML(r.work||"")}<br>
備考：${escapeHTML(r.memo||"")}
<div class="saved-report-actions">
<button class="saved-edit-button" onclick="editReport(${x.i})">✏️ 編集</button>
<button class="saved-delete-button" onclick="deleteReport(${x.i})">🗑️ 削除</button>
</div></div>`;
});
html+="</div></div>";
list.innerHTML+=html;
});
}

function escapeHTML(value){
return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function toggleSavedMonth(id,button){
let e=document.getElementById(id);
e.classList.toggle("open");
button.textContent=button.textContent.replace(e.classList.contains("open")?"▶":"▼",e.classList.contains("open")?"▼":"▶");
}

/* オイル管理 */

function toggleOilManagement(){
let e=oilManagement;
let open=e.style.display==="block";
e.style.display=open?"none":"block";
oilToggleButton.textContent=open?"🛢️ オイル交換管理を見る":"📕 オイル交換管理を閉じる";
if(!open)updateOilManagement();
}

function saveOilChange(){
let mileage=Number(oilChangeMileage.value);
if(!mileage||mileage<=0){alert("オイル交換時の走行距離を入力してください");return;}
let s=getSettings();
if(!s.car){alert("先に基本情報を設定してください");return;}
let records=getOilRecords();
let next=mileage+4000;
records.push({date:date.value||getToday(),mileage,nextMileage:next,car:s.car,driver:s.driver});
localStorage.setItem("soukouOilRecords",JSON.stringify(records));
oilChangeMileage.value="";
updateOilManagement();
if(monthlyList.style.display==="block")showMonthlyList();
alert("オイル交換を記録しました！\n交換時："+mileage.toLocaleString()+" km\n次回交換："+next.toLocaleString()+" km");
}

function deleteOilRecord(index){
if(!confirm("このオイル交換記録を削除しますか？"))return;
let r=getOilRecords();
r.splice(index,1);
localStorage.setItem("soukouOilRecords",JSON.stringify(r));
updateOilManagement();
if(monthlyList.style.display==="block")showMonthlyList();
}

function getCurrentMileage(){
let s=getSettings();
let values=getReports().filter(r=>r.car===s.car&&r.end).map(r=>Number(r.end));
getOilRecords().filter(r=>!r.car||r.car===s.car).forEach(r=>values.push(Number(r.mileage)));
let input=Number(returnMileage.value);
if(input>0)values.push(input);
return values.length?Math.max(...values):0;
}

function updateOilManagement(){
let current=getCurrentMileage();
oilCurrentMileage.textContent=current?current.toLocaleString():"---";
oilWarning.style.display="none";
oilOk.style.display="none";
let s=getSettings();
let all=getOilRecords();
let records=all.filter(r=>!r.car||!s.car||r.car===s.car);
records.sort((a,b)=>a.date.localeCompare(b.date)||Number(a.mileage)-Number(b.mileage));
if(!records.length){
oilNextMileage.textContent="未登録";
oilHistory.innerHTML="";
return;
}
let latest=records[records.length-1];
let next=Number(latest.nextMileage);
oilNextMileage.textContent=next.toLocaleString()+" km";
if(current){
let remain=next-current;
if(remain<=0){
oilWarning.style.display="block";
oilWarning.textContent="🚨 オイル交換時期を超えています！ "+Math.abs(remain).toLocaleString()+" km 超過";
}else if(remain<=500){
oilWarning.style.display="block";
oilWarning.textContent="⚠️ オイル交換まであと "+remain.toLocaleString()+" km です！";
}else{
oilOk.style.display="block";
oilOk.textContent="オイル交換まであと "+remain.toLocaleString()+" km";
}
}
let html="<h3 style='color:#e65100'>🛢️ オイル交換履歴</h3>";
records.slice().reverse().forEach(r=>{
let index=all.indexOf(r);
html+=`<div class="fuel-history-item">${formatDateWithDay(r.date)}<br>
交換時：${Number(r.mileage).toLocaleString()} km<br>
次回：${Number(r.nextMileage).toLocaleString()} km<br>
<button class="oil-delete" onclick="deleteOilRecord(${index})">削除</button></div>`;
});
oilHistory.innerHTML=html;
}

/* 給油管理 */

function toggleFuelManagement(){
let open=fuelManagement.style.display==="block";
fuelManagement.style.display=open?"none":"block";
fuelToggleButton.textContent=open?"⛽ 給油管理を見る":"📕 給油管理を閉じる";
if(!open)updateFuelManagement();
}

function getFuelEconomy(record){
let records=getFuelRecords().filter(r=>(!record.car||!r.car||r.car===record.car)&&r.mileage!==undefined);
records.sort((a,b)=>a.date.localeCompare(b.date)||Number(a.mileage)-Number(b.mileage));
let previous=records.filter(r=>r.date<record.date||(r.date===record.date&&Number(r.mileage)<Number(record.mileage))).pop();
if(!previous)return null;
let distance=Number(record.mileage)-Number(previous.mileage);
let liters=Number(record.liters);
return distance>0&&liters>0?distance/liters:null;
}

function saveFuel(){
let mileage=Number(fuelMileage.value);
let liters=Number(fuelLiters.value);
if(!mileage||mileage<=0){alert("給油時走行距離を入力してください");return;}
if(!liters||liters<=0){alert("給油量を入力してください");return;}
let s=getSettings();
if(!s.car){alert("先に基本情報を設定してください");return;}
let records=getFuelRecords();
if(records.some(r=>r.car===s.car&&Number(r.mileage)>mileage)){
if(!confirm("今回より大きい走行距離の給油記録があります。このまま記録しますか？"))return;
}
let r={date:date.value||getToday(),mileage,liters,car:s.car,driver:s.driver};
records.push(r);
localStorage.setItem("soukouFuelRecords",JSON.stringify(records));
fuelMileage.value="";
fuelLiters.value="";
updateFuelManagement();
if(monthlyList.style.display==="block")showMonthlyList();
let economy=getFuelEconomy(r);
alert("給油を記録しました！\n給油時："+mileage.toLocaleString()+" km\n給油量："+liters.toFixed(1)+" L\n燃費："+(economy?economy.toFixed(1)+" km/L":"次回から計算します"));
}

function deleteFuelRecord(index){
if(!confirm("この給油記録を削除しますか？"))return;
let r=getFuelRecords();
r.splice(index,1);
localStorage.setItem("soukouFuelRecords",JSON.stringify(r));
updateFuelManagement();
if(monthlyList.style.display==="block")showMonthlyList();
}

function updateFuelManagement(){
let records=getFuelRecords();
let s=getSettings();
let all=records.filter(r=>!r.car||!s.car||r.car===s.car);
all.sort((a,b)=>b.date.localeCompare(a.date)||Number(b.mileage)-Number(a.mileage));
let html="<h3 style='color:#1565c0'>⛽ 給油履歴</h3>";
if(!all.length)html+='<div class="fuel-history-item">まだ給油記録がありません</div>';
all.forEach(r=>{
let index=records.indexOf(r);
let economy=getFuelEconomy(r);
html+=`<div class="fuel-history-item">${formatDateWithDay(r.date)}<br>
給油時走行距離：<strong>${Number(r.mileage).toLocaleString()} km</strong><br>
給油量：<strong>${Number(r.liters).toFixed(1)} L</strong><br>
燃費：<span class="fuel-economy">${economy?economy.toFixed(1)+" km/L":"前回記録なし"}</span><br>
<button class="fuel-delete" onclick="deleteFuelRecord(${index})">削除</button></div>`;
});
fuelHistory.innerHTML=html;
}

/* 月間用データ */

function getOilText(d){
return getOilRecords().filter(r=>r.date===d).map(r=>"🛢️ "+Number(r.mileage).toLocaleString()+"km").join("<br>");
}

function getFuelText(d){
return getFuelRecords().filter(r=>r.date===d).map(r=>{
let economy=getFuelEconomy(r);
return "⛽ "+Number(r.liters).toFixed(1)+"L"+(economy?"<br>"+economy.toFixed(1)+" km/L":"");
}).join("<br>");
}

function getMonthlyFuelEconomy(month){
let s=getSettings();
let records=getFuelRecords().filter(r=>r.car===s.car);
records.sort((a,b)=>a.date.localeCompare(b.date)||Number(a.mileage)-Number(b.mileage));
let totalDistance=0,totalLiters=0;
records.forEach((r,i)=>{
if(!r.date.startsWith(month)||i===0)return;
let distance=Number(r.mileage)-Number(records[i-1].mileage);
let liters=Number(r.liters);
if(distance>0&&liters>0){totalDistance+=distance;totalLiters+=liters;}
});
return totalLiters>0?totalDistance/totalLiters:null;
}

function showMonthlyList(){
let month=printMonth.value;
if(!month)return;
let reports=getReports().filter(r=>r.date.startsWith(month)).sort((a,b)=>a.date.localeCompare(b.date));
let total=0;
let html="";
reports.forEach(r=>{
total+=Number(r.distance)||0;
html+=`<tr><td>${formatDateWithDay(r.date)}</td><td>${escapeHTML(r.driver)}</td><td>${escapeHTML(r.car)}</td><td>${r.start}</td><td>${r.end}</td><td>${r.distance} km</td><td>${escapeHTML(r.work)}</td><td class="fuel-mark">${getFuelText(r.date)}</td><td class="oil-mark">${getOilText(r.date)}</td></tr>`;
});
if(!reports.length)html='<tr><td colspan="9">この月の日報はありません</td></tr>';
monthlyListBody.innerHTML=html;
let economy=getMonthlyFuelEconomy(month);
monthlySummary.textContent="月間走行距離合計："+total.toLocaleString()+" km　｜　月間燃費："+(economy?economy.toFixed(1)+" km/L":"---");
}

function toggleMonthlyList(){
let open=monthlyList.style.display==="block";
if(!open)showMonthlyList();
monthlyList.style.display=open?"none":"block";
monthlyListButton.textContent=open?"📅 月間日報一覧を見る":"📕 月間日報一覧を閉じる";
}
