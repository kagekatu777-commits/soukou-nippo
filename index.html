<!DOCTYPE html>
<html lang="ja">
<head>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1976d2">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>走行日報</title>

<style>
body{
    font-family:sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:15px;
}

.card{
    background:white;
    border-radius:12px;
    padding:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}

h1{
    text-align:center;
    color:#1565c0;
}

label{
    display:block;
    margin-top:15px;
    font-weight:bold;
    font-size:18px;
}

input{
    width:100%;
    padding:12px;
    font-size:20px;
    box-sizing:border-box;
    border-radius:8px;
    border:1px solid #ccc;
}

button{
    width:100%;
    margin-top:20px;
    padding:15px;
    font-size:22px;
    background:#1565c0;
    color:white;
    border:none;
    border-radius:10px;
}

table{
    width:100%;
    margin-top:20px;
    border-collapse:collapse;
}

th,td{
    border:1px solid #ccc;
    padding:8px;
    text-align:center;
}

th{
    background:#1565c0;
    color:white;
}

.distance{
    background:#eeeeee;
}

/* 削除ボタン */
.delete-button{
    background:#d32f2f;
    color:white;
    border:none;
    border-radius:6px;
    padding:8px 10px;
    margin:0;
    width:auto;
    font-size:14px;
}
</style>

</head>

<body>

<div class="card">

<h1>🚚走行日報</h1>

<label>会社名</label>
<input type="text" id="company">

<label>車番</label>
<input type="text" id="car">

<label>日付</label>
<input type="date" id="date">

<label>出発時走行距離</label>
<input type="number" id="start" placeholder="出発時の走行距離を入力">

<label>帰社時走行距離</label>
<input type="number" id="returnMileage" placeholder="帰社時の走行距離を入力">

<label>控除走行距離</label>
<input type="text" id="distance" class="distance" readonly placeholder="自動計算">

<label>運転者名</label>
<input type="text" id="driver">

<label>運行内容</label>
<input type="text" id="work">

<label>備考</label>
<input type="text" id="memo">

<button onclick="save()">保存</button>

<table>

<thead>
<tr>
<th>日付</th>
<th>運転者</th>
<th>車番</th>
<th>出発</th>
<th>帰社</th>
<th>控除走行距離</th>
<th>削除</th>
</tr>
</thead>

<tbody id="list">
</tbody>

</table>

</div>

<script>

// =====================================
// 今日の日付を取得
// =====================================

function getToday(){

    let today = new Date();

    let year = today.getFullYear();

    let month = String(today.getMonth() + 1).padStart(2, "0");

    let day = String(today.getDate()).padStart(2, "0");

    return year + "-" + month + "-" + day;
}


// =====================================
// 日付を今日にする
// =====================================

function setToday(){

    document.getElementById("date").value = getToday();

}


// =====================================
// 控除走行距離を自動計算
// =====================================

function calculateDistance(){

    let start = Number(
        document.getElementById("start").value
    );

    let end = Number(
        document.getElementById("returnMileage").value
    );

    if(end >= start && start > 0){

        let distance = end - start;

        document.getElementById("distance").value =
            distance + " km";

    }else{

        document.getElementById("distance").value = "";

    }

}


// =====================================
// 入力途中の日報を自動保存
// =====================================

function saveDraft(){

    let draft = {

        company:
            document.getElementById("company").value,

        car:
            document.getElementById("car").value,

        date:
            document.getElementById("date").value,

        start:
            document.getElementById("start").value,

        returnMileage:
            document.getElementById("returnMileage").value,

        driver:
            document.getElementById("driver").value,

        work:
            document.getElementById("work").value,

        memo:
            document.getElementById("memo").value

    };


    localStorage.setItem(
        "soukouDraft",
        JSON.stringify(draft)
    );

}


// =====================================
// 入力途中の日報を復元
// =====================================

function loadDraft(){

    let saved =
        localStorage.getItem("soukouDraft");

    if(!saved){

        setToday();

        return;
    }


    let draft =
        JSON.parse(saved);


    let today = getToday();


    // 昨日以前の途中データなら破棄
    if(draft.date !== today){

        localStorage.removeItem("soukouDraft");

        setToday();

        return;
    }


    // 今日の途中データなら復元

    document.getElementById("company").value =
        draft.company || "";

    document.getElementById("car").value =
        draft.car || "";

    document.getElementById("date").value =
        draft.date || today;

    document.getElementById("start").value =
        draft.start || "";

    document.getElementById("returnMileage").value =
        draft.returnMileage || "";

    document.getElementById("driver").value =
        draft.driver || "";

    document.getElementById("work").value =
        draft.work || "";

    document.getElementById("memo").value =
        draft.memo || "";


    calculateDistance();

}


// =====================================
// 出発時・帰社時の入力が変わったら計算
// =====================================

document.getElementById("start")
.addEventListener("input", function(){

    calculateDistance();

    saveDraft();

});


document.getElementById("returnMileage")
.addEventListener("input", function(){

    calculateDistance();

    saveDraft();

});


// =====================================
// その他の入力も自動保存
// =====================================

document.getElementById("company")
.addEventListener("input", saveDraft);

document.getElementById("car")
.addEventListener("input", saveDraft);

document.getElementById("driver")
.addEventListener("input", saveDraft);

document.getElementById("work")
.addEventListener("input", saveDraft);

document.getElementById("memo")
.addEventListener("input", saveDraft);


// =====================================
// 日付が変更された場合も保存
// =====================================

document.getElementById("date")
.addEventListener("change", saveDraft);


// =====================================
// 保存
// =====================================

function save(){

    let company =
        document.getElementById("company").value;

    let date =
        document.getElementById("date").value;

    let car =
        document.getElementById("car").value;

    let start =
        Number(document.getElementById("start").value);

    let end =
        Number(document.getElementById("returnMileage").value);

    let driver =
        document.getElementById("driver").value;

    let work =
        document.getElementById("work").value;

    let memo =
        document.getElementById("memo").value;


    // 入力チェック

    if(!date || !car || !driver || !start || !end){

        alert("必要な項目を入力してください");

        return;
    }


    // 走行距離チェック

    if(end < start){

        alert(
            "帰社時走行距離は、出発時走行距離以上にしてください"
        );

        return;
    }


    // 控除走行距離

    let distance = end - start;


    // 保存するデータ

    let report = {

        company: company,

        date: date,

        car: car,

        start: start,

        end: end,

        distance: distance,

        driver: driver,

        work: work,

        memo: memo

    };


    // 今までの保存データを取得

    let reports =
        JSON.parse(
            localStorage.getItem("soukouReports")
        ) || [];


    // 新しい日報を追加

    reports.push(report);


    // 保存

    localStorage.setItem(
        "soukouReports",
        JSON.stringify(reports)
    );


    // ★正式保存したので途中データを削除

    localStorage.removeItem("soukouDraft");


    // 一覧を更新

    displayReports();


    // 保存完了

    alert("日報を保存しました！");


    // 入力欄をクリア

    document.getElementById("car").value = "";

    document.getElementById("start").value = "";

    document.getElementById("returnMileage").value = "";

    document.getElementById("distance").value = "";

    document.getElementById("driver").value = "";

    document.getElementById("work").value = "";

    document.getElementById("memo").value = "";


    // 日付は今日のまま

    setToday();

}


// =====================================
// 日報を削除
// =====================================

function deleteReport(index){

    if(!confirm("この日報を削除しますか？")){

        return;

    }


    let reports =
        JSON.parse(
            localStorage.getItem("soukouReports")
        ) || [];


    reports.splice(index, 1);


    localStorage.setItem(
        "soukouReports",
        JSON.stringify(reports)
    );


    displayReports();


    alert("日報を削除しました");

}


// =====================================
// 保存した日報を表示
// =====================================

function displayReports(){

    let reports =
        JSON.parse(
            localStorage.getItem("soukouReports")
        ) || [];


    let list =
        document.getElementById("list");


    list.innerHTML = "";


    reports.forEach(function(report, index){

        let row = `

        <tr>

            <td>${report.date}</td>

            <td>${report.driver}</td>

            <td>${report.car}</td>

            <td>${report.start}</td>

            <td>${report.end}</td>

            <td>${report.distance} km</td>

            <td>
                <button
                    class="delete-button"
                    onclick="deleteReport(${index})">
                    削除
                </button>
            </td>

        </tr>

        `;


        list.innerHTML += row;

    });

}


// =====================================
// アプリを開いたとき
// =====================================

// 今日の日付・途中データを確認

loadDraft();


// 保存済みデータを表示

displayReports();


// =====================================
// ホーム画面アプリ対応
// =====================================

if ("serviceWorker" in navigator) {

    navigator.serviceWorker.register("sw.js");

}

</script>

</body>
</html>
