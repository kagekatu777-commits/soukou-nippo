<!-- 保存済み日報 -->

<h2
style="color:#1565c0;margin-top:30px;">

📋 保存済み日報

</h2>


<table>

<thead>

<tr>

<th>日付</th>
<th>運転者</th>
<th>車番</th>
<th>出発</th>
<th>帰社</th>
<th>距離</th>
<th>操作</th>

</tr>

</tbody>

<script>


// =====================================
// 編集中の日報番号
// =====================================

let editingIndex = -1;


// =====================================
// 今日の日付
// =====================================

function getToday(){

    let today = new Date();

    let year =
        today.getFullYear();

    let month =
        String(today.getMonth() + 1)
        .padStart(2,"0");

    let day =
        String(today.getDate())
        .padStart(2,"0");

    return year + "-" + month + "-" + day;

}


// =====================================
// 曜日を取得
// =====================================

function getDayOfWeek(dateString){

    if(!dateString){
        return "";
    }

    let date =
        new Date(dateString + "T00:00:00");

    let days = [
        "日",
        "月",
        "火",
        "水",
        "木",
        "金",
        "土"
    ];

    return days[date.getDay()];

}


// =====================================
// 日付＋曜日表示
// =====================================

function formatDateWithDay(dateString){

    if(!dateString){
        return "";
    }

    let parts =
        dateString.split("-");

    if(parts.length !== 3){
        return dateString;
    }

    let year =
        parts[0];

    let month =
        parts[1];

    let day =
        parts[2];

    let dayOfWeek =
        getDayOfWeek(dateString);

    return (
        year +
        "/" +
        month +
        "/" +
        day +
        "（" +
        dayOfWeek +
        "）"
    );

}


// =====================================
// 前日の日付
// =====================================

function getPreviousDate(dateString){

    let date =
        new Date(dateString + "T00:00:00");

    date.setDate(
        date.getDate() - 1
    );

    let year =
        date.getFullYear();

    let month =
        String(date.getMonth() + 1)
        .padStart(2,"0");

    let day =
        String(date.getDate())
        .padStart(2,"0");

    return year + "-" + month + "-" + day;

}


// =====================================
// 今日の日付をセット
// =====================================

function setToday(){

    document.getElementById("date").value =
        getToday();

}


// =====================================
// 前日の帰社距離を自動入力
// =====================================

function loadPreviousMileage(){

    let date =
        document.getElementById("date").value;

    if(!date){
        return;
    }

    if(editingIndex !== -1){
        return;
    }

    let currentStart =
        document.getElementById("start").value;

    if(currentStart){
        return;
    }

    let settingsData =
        localStorage.getItem("soukouSettings");

    if(!settingsData){
        return;
    }

    let settings =
        JSON.parse(settingsData);

    let reports =
        JSON.parse(
            localStorage.getItem("soukouReports")
        ) || [];

    let previousDate =
        getPreviousDate(date);

    let previousReports =
        reports.filter(function(report){

            return (
                report.date === previousDate &&
                report.car === settings.car
            );

        });

    if(previousReports.length === 0){
        return;
    }

    let previousReport =
        previousReports[
            previousReports.length - 1
        ];

    if(
        previousReport.end !== undefined &&
        previousReport.end !== null &&
        previousReport.end !== ""
    ){

        document.getElementById("start").value =
            previousReport.end;

        calculateDistance();

        saveDraft();

    }

}


// =====================================
// 設定画面
// =====================================

function toggleSettings(){

    let settings =
        document.getElementById("settings");

    if(settings.style.display === "block"){

        settings.style.display = "none";

    }else{

        settings.style.display = "block";

        loadSettings();

    }

}


// =====================================
// 基本情報保存
// =====================================

function saveSettings(){

    let company =
        document.getElementById(
            "settingCompany"
        ).value.trim();

    let car =
        document.getElementById(
            "settingCar"
        ).value.trim();

    let driver =
        document.getElementById(
            "settingDriver"
        ).value.trim();

    if(!company || !car || !driver){

        alert(
            "会社名・車番・運転者名を入力してください"
        );

        return;

    }

    let settings = {

        company:company,
        car:car,
        driver:driver

    };

    localStorage.setItem(
        "soukouSettings",
        JSON.stringify(settings)
    );

    updateHeader();

    document.getElementById(
        "settings"
    ).style.display = "none";

    document.getElementById("start").value = "";

    loadPreviousMileage();

    updateOilManagement();

    alert(
        "基本情報を保存しました！"
    );

}


// =====================================
// 基本情報読み込み
// =====================================

function loadSettings(){

    let saved =
        localStorage.getItem("soukouSettings");

    if(!saved){

        document.getElementById(
            "settingCompany"
        ).value = "";

        document.getElementById(
            "settingCar"
        ).value = "";

        document.getElementById(
            "settingDriver"
        ).value = "";

        return;

    }

    let settings =
        JSON.parse(saved);

    document.getElementById(
        "settingCompany"
    ).value =
        settings.company || "";

    document.getElementById(
        "settingCar"
    ).value =
        settings.car || "";

    document.getElementById(
        "settingDriver"
    ).value =
        settings.driver || "";

}


// =====================================
// ヘッダー更新
// =====================================

function updateHeader(){

    let saved =
        localStorage.getItem("soukouSettings");

    if(!saved){

        document.getElementById(
            "headerCompany"
        ).textContent =
            "会社名未設定";

        document.getElementById(
            "headerCar"
        ).textContent =
            "未設定";

        document.getElementById(
            "headerDriver"
        ).textContent =
            "未設定";

        return;

    }

    let settings =
        JSON.parse(saved);

    document.getElementById(
        "headerCompany"
    ).textContent =
        settings.company ||
        "会社名未設定";

    document.getElementById(
        "headerCar"
    ).textContent =
        settings.car ||
        "未設定";

    document.getElementById(
        "headerDriver"
    ).textContent =
        settings.driver ||
        "未設定";

}


// =====================================
// 走行距離計算
// =====================================

function calculateDistance(){

    let start =
        Number(
            document.getElementById(
                "start"
            ).value
        );

    let end =
        Number(
            document.getElementById(
                "returnMileage"
            ).value
        );

    if(
        end >= start &&
        start > 0
    ){

        document.getElementById(
            "distance"
        ).value =
            (end - start) + " km";

    }else{

        document.getElementById(
            "distance"
        ).value = "";

    }

}


// =====================================
// 下書き保存
// =====================================

function saveDraft(){

    if(editingIndex !== -1){
        return;
    }

    let draft = {

        date:
            document.getElementById("date").value,

        start:
            document.getElementById("start").value,

        returnMileage:
            document.getElementById(
                "returnMileage"
            ).value,

        work:
            document.getElementById("work").value,

        memo:
            document.getElementById("memo").value

    };

    localStorage.setItem(
        "soukouDraft",
        JSON.stringify(draft)
    );

}


// =====================================
// 下書き復元
// =====================================

function loadDraft(){

    let saved =
        localStorage.getItem("soukouDraft");

    if(!saved){

        setToday();

        loadPreviousMileage();

        return;

    }

    let draft =
        JSON.parse(saved);

    let today =
        getToday();

    if(draft.date !== today){

        localStorage.removeItem(
            "soukouDraft"
        );

        setToday();

        loadPreviousMileage();

        return;

    }

    document.getElementById("date").value =
        draft.date || today;

    document.getElementById("start").value =
        draft.start || "";

    document.getElementById(
        "returnMileage"
    ).value =
        draft.returnMileage || "";

    document.getElementById("work").value =
        draft.work || "";

    document.getElementById("memo").value =
        draft.memo || "";

    if(!draft.start){

        loadPreviousMileage();

    }

    calculateDistance();

}


// =====================================
// 編集
// =====================================

function editReport(index){

    let reports =
        JSON.parse(
            localStorage.getItem(
                "soukouReports"
            )
        ) || [];

    let report =
        reports[index];

    if(!report){
        return;
    }

    editingIndex = index;

    document.getElementById("date").value =
        report.date;

    document.getElementById("start").value =
        report.start;

    document.getElementById(
        "returnMileage"
    ).value =
        report.end;

    document.getElementById("work").value =
        report.work || "";

    document.getElementById("memo").value =
        report.memo || "";

    calculateDistance();

    document.getElementById(
        "editMode"
    ).style.display = "block";

    document.getElementById(
        "saveButton"
    ).textContent =
        "変更を保存";

    document.getElementById(
        "cancelEditButton"
    ).style.display =
        "block";

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


// =====================================
// 編集キャンセル
// =====================================

function cancelEdit(){

    editingIndex = -1;

    document.getElementById(
        "editMode"
    ).style.display =
        "none";

    document.getElementById(
        "saveButton"
    ).textContent =
        "日報を保存";

    document.getElementById(
        "cancelEditButton"
    ).style.display =
        "none";

    clearInputs();

    setToday();

    loadPreviousMileage();

}


// =====================================
// 入力クリア
// =====================================

function clearInputs(){

    document.getElementById("start").value = "";

    document.getElementById(
        "returnMileage"
    ).value = "";

    document.getElementById(
        "distance"
    ).value = "";

    document.getElementById("work").value = "";

    document.getElementById("memo").value = "";

}


// =====================================
// 入力イベント
// =====================================

document.getElementById("start")
.addEventListener(
    "input",
    function(){

        calculateDistance();

        saveDraft();

        updateOilManagement();

    }
);


document.getElementById("returnMileage")
.addEventListener(
    "input",
    function(){

        calculateDistance();

        saveDraft();

        updateOilManagement();

    }
);


document.getElementById("work")
.addEventListener(
    "input",
    saveDraft
);


document.getElementById("memo")
.addEventListener(
    "input",
    saveDraft
);


// =====================================
// 日付変更
// =====================================

document.getElementById("date")
.addEventListener(
    "change",
    function(){

        if(editingIndex !== -1){
            return;
        }

        document.getElementById(
            "start"
        ).value = "";

        document.getElementById(
            "returnMileage"
        ).value = "";

        document.getElementById(
            "distance"
        ).value = "";

        saveDraft();

        loadPreviousMileage();

    }
);


// =====================================
// 日報保存
// =====================================

function save(){

    let settingsData =
        localStorage.getItem(
            "soukouSettings"
        );

    if(!settingsData){

        alert(
            "先に「基本情報を変更」から\n" +
            "会社名・車番・運転者名を設定してください"
        );

        document.getElementById(
            "settings"
        ).style.display =
            "block";

        loadSettings();

        return;

    }

    let settings =
        JSON.parse(settingsData);

    let date =
        document.getElementById("date").value;

    let start =
        Number(
            document.getElementById("start").value
        );

    let end =
        Number(
            document.getElementById(
                "returnMileage"
            ).value
        );

    let work =
        document.getElementById("work").value;

    let memo =
        document.getElementById("memo").value;

    if(
        !date ||
        !start ||
        !end
    ){

        alert(
            "日付・出発時走行距離・帰社時走行距離を入力してください"
        );

        return;

    }

    if(end < start){

        alert(
            "帰社時走行距離は、出発時走行距離以上にしてください"
        );

        return;

    }

    let distance =
        end - start;

    let reports =
        JSON.parse(
            localStorage.getItem(
                "soukouReports"
            )
        ) || [];


    // 編集保存

    if(editingIndex !== -1){

        reports[editingIndex] = {

            company:
                settings.company,

            date:
                date,

            car:
                settings.car,

            start:
                start,

            end:
                end,

            distance:
                distance,

            driver:
                settings.driver,

            work:
                work,

            memo:
                memo

        };

        localStorage.setItem(
            "soukouReports",
            JSON.stringify(reports)
        );

        alert(
            "日報を変更しました！"
        );

        editingIndex = -1;

        document.getElementById(
            "editMode"
        ).style.display =
            "none";

        document.getElementById(
            "saveButton"
        ).textContent =
            "日報を保存";

        document.getElementById(
            "cancelEditButton"
        ).style.display =
            "none";

        clearInputs();

        localStorage.removeItem(
            "soukouDraft"
        );

        setToday();

        displayReports();

        loadPreviousMileage();

        updateOilManagement();

        return;

    }


    // 新規保存

    let report = {

        company:
            settings.company,

        date:
            date,

        car:
            settings.car,

        start:
            start,

        end:
            end,

        distance:
            distance,

        driver:
            settings.driver,

        work:
            work,

        memo:
            memo

    };

    reports.push(report);

    localStorage.setItem(
        "soukouReports",
        JSON.stringify(reports)
    );

    localStorage.removeItem(
        "soukouDraft"
    );

    displayReports();

    alert(
        "日報を保存しました！"
    );

    clearInputs();

    setToday();

    loadPreviousMileage();

    updateOilManagement();

}

function saveOilChange(){

    let mileage =
        Number(
            document.getElementById(
                "oilChangeMileage"
            ).value
        );

    if(!mileage || mileage <= 0){

        alert(
            "オイル交換時の走行距離を入力してください"
        );

    }

    let settingsData =
        localStorage.getItem(

        );

        );

        JSON.parse(settingsData);

        document.getElementById(
            "date"

// =====================================
// 現在の走行距離取得
// =====================================

function getCurrentMileage(){

    let reports =
        JSON.parse(
            localStorage.getItem(
                "soukouReports"
            )
        ) || [];

    let settingsData =
        localStorage.getItem(
            "soukouSettings"
        );

    if(!settingsData){
        return 0;
    }

    let settings =
        JSON.parse(settingsData);

    let carReports =
        reports.filter(
            function(report){

                return (
                    report.car === settings.car &&
                    report.end !== undefined &&
                    report.end !== null &&
                    report.end !== ""
                );

            }
        );

    if(carReports.length === 0){

        let currentInput =
            Number(
                document.getElementById(
                    "returnMileage"
                ).value
            );

        return currentInput || 0;

    }

    carReports.sort(
        function(a,b){

            if(a.date !== b.date){

                return a.date.localeCompare(
                    b.date
                );

            }

            return (
                Number(a.end) -
                Number(b.end)
            );

        }
    );

    return Number(
        carReports[
            carReports.length - 1
        ].end
    ) || 0;

}


// =====================================
// オイル交換管理表示
// =====================================

function updateOilManagement(){

    let currentMileage =
        getCurrentMileage();

    let currentElement =
        document.getElementById(
            "oilCurrentMileage"
        );

    if(currentMileage > 0){

        currentElement.textContent =
            currentMileage.toLocaleString();

    }else{

        currentElement.textContent =
            "---";

    }

    let records =
        getOilRecords();

    let nextElement =
        document.getElementById(
            "oilNextMileage"
        );

    let warningElement =
        document.getElementById(
            "oilWarning"
        );

    let okElement =
        document.getElementById(
            "oilOk"
        );

    warningElement.style.display =
        "none";

    okElement.style.display =
        "none";

    if(records.length === 0){

        nextElement.textContent =
            "未登録";

        document.getElementById(
            "oilHistory"
        ).innerHTML = "";

        return;

    }

    let settingsData =
        localStorage.getItem(
            "soukouSettings"
        );

    let settings =
        settingsData
        ? JSON.parse(settingsData)
        : {};

    let carRecords =
        records.filter(
            function(record){

                return (
                    !record.car ||
                    !settings.car ||
                    record.car === settings.car
                );

            }
        );

    if(carRecords.length === 0){

        nextElement.textContent =
            "未登録";

        return;

    }

    carRecords.sort(
        function(a,b){

            return (
                a.date.localeCompare(b.date)
            );

        }
    );

    let latest =
        carRecords[
            carRecords.length - 1
        ];

    let nextMileage =
        Number(latest.nextMileage);

    nextElement.textContent =
        nextMileage.toLocaleString() +
        " km";

    if(currentMileage > 0){

        let remaining =
            nextMileage -
            currentMileage;

        if(remaining <= 0){

            warningElement.style.display =
                "block";

            warningElement.textContent =
                "🚨 オイル交換時期を超えています！ " +
                Math.abs(remaining).toLocaleString() +
                " km 超過";

        }else if(remaining <= 500){

            warningElement.style.display =
                "block";

            warningElement.textContent =
                "⚠️ オイル交換まであと " +
                remaining.toLocaleString() +
                " km です！";

        }else{

            okElement.style.display =
                "block";

            okElement.textContent =
                "オイル交換まであと " +
                remaining.toLocaleString() +
                " km";

        }

    }


    // オイル交換履歴

    let historyHtml = `

<h3 style="color:#e65100;">
🛢️ オイル交換履歴
</h3>

`;

    carRecords
    .slice()
    .reverse()
    .forEach(
        function(record,index){

            let originalIndex =
                records.indexOf(record);

            historyHtml += `

<div
style="
background:white;
border:1px solid #ddd;
border-radius:8px;
padding:10px;
margin-top:8px;
">

${formatDateWithDay(record.date)}

<br>

交換時：
<strong>
${Number(record.mileage).toLocaleString()} km
</strong>

<br>

次回：
<strong>
${Number(record.nextMileage).toLocaleString()} km
</strong>

<br>

<button
class="oil-delete"
onclick="deleteOilRecord(${originalIndex})">

削除

</button>

</div>

`;

        }
    );

    document.getElementById(
        "oilHistory"
    ).innerHTML =
        historyHtml;

}


// =====================================
// オイル交換表示判定
// =====================================

function getOilText(date){

    let records =
        getOilRecords();

    let matching =
        records.filter(
            function(record){

                return record.date === date;

            }
        );

    if(matching.length === 0){
        return "";
    }

    let text = "";

    matching.forEach(
        function(record){

            if(text){
                text += "<br>";
            }

            text +=
                "🛢️ " +
                Number(
                    record.mileage
                ).toLocaleString() +
                "km";

        }
    );

    return text;

}
